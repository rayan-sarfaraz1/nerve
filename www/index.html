function applySave(txt){
  if (!txt) return;
  var d, i;
  try { d = JSON.parse(txt); } catch(e){ return; }
  if (!d || typeof d !== "object") return;
  if (typeof d.best  === "number") best   = Math.max(best,   Math.floor(d.best));
  if (typeof d.bl    === "number") bestLevel = Math.max(bestLevel, Math.floor(d.bl));
  CFG.barStyle = "flat";
  if (typeof d.coins === "number") wallet = Math.max(999999, Math.floor(d.coins));
  else wallet = 999999;
  if (d.own && d.own.length) for (i = 0; i < d.own.length; i++) OWNED[d.own[i]] = true;
  if (d.ch && findChar(d.ch)) charId = d.ch;
  if (d.ob && findObj(d.ob))  objId  = d.ob;
  if (d.bg && findBg(d.bg))   bgId   = d.bg;
  if (d.sh && findShape(d.sh)) {
    shapeId = d.sh;
    var sidx = SHAPES.findIndex(function(s) { return s.id === shapeId; });
    S.shape = sidx >= 0 ? sidx : 0;
  }
  if (d.pw && typeof d.pw === "object") {
    ["slow","revive","shield","double"].forEach(function(id){
      if (typeof d.pw[id] === "number") POWER_STOCK[id] = Math.max(0, Math.floor(d.pw[id]));
    });
  }
}

function loadSave(){
  var done = false;
  function finish(){ if (done) return; done = true; dataReady = true; }
  setTimeout(finish, 3000);
  if (IN_YT && YT.game && YT.game.loadData) {
    try {
      YT.game.loadData().then(
        function(txt){ applySave(txt); finish(); },
        function(){ logWarn(); finish(); }
      );
    } catch(e){ logWarn(); finish(); }
  } else {
    try {
      var raw = localStorage.getItem("nerve_save");
      if (raw) applySave(raw);
      else {
        var old = localStorage.getItem("nerve_best");
        if (old) best = Math.max(best, parseInt(old, 10) || 0);
      }
    } catch(e){}
    finish();
  }
}

function saveNow(){
  savePending = false;

    try { YT.game.saveData(txt).then(null, function(){ logWarn(); }); } catch(e){ logWarn(); }
  } else {
    try { localStorage.setItem("nerve_save", txt); } catch(e){}
  }
}

function queueSave(){
  savePending = true;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    saveTimer = 0;
    if (window.requestIdleCallback) {
      window.requestIdleCallback(function(){ if (savePending) saveNow(); }, {timeout:2000});
    } else { saveNow(); }
  }, 700);
}

var CROSS_TIPS = [[-1,-1],[1,1],[1,-1],[-1,1]];

/* regular polygon - har kinara barabar lamba, is liye raftaar bhi barabar */
function polyAt(t, n, rad, rot){
  var seg = 1 / n, i = Math.floor(t / seg), f, a1, a2, x1, y1, x2, y2;
  if (i >= n) i = n - 1;
  f = (t - i * seg) / seg;
  a1 = rot + (i * Math.PI * 2) / n;
  a2 = rot + ((i + 1) * Math.PI * 2) / n;
  x1 = A.cx + Math.cos(a1) * rad; y1 = A.cy + Math.sin(a1) * rad;
  x2 = A.cx + Math.cos(a2) * rad; y2 = A.cy + Math.sin(a2) * rad;
  return { x: x1 + (x2 - x1) * f, y: y1 + (y2 - y1) * f };
}

function starPt(k, pts, rOut, rIn, rot){
  var r = (k % 2 === 0) ? rOut : rIn;
  var a = rot + (k * Math.PI) / pts;
  return { x: A.cx + Math.cos(a) * r, y: A.cy + Math.sin(a) * r };
}
function starAt(t, pts, rOut, rIn, rot){
  var n = pts * 2, seg = 1 / n, i = Math.floor(t / seg), f, p1, p2;
  if (i >= n) i = n - 1;
  f = (t - i * seg) / seg;
  p1 = starPt(i, pts, rOut, rIn, rot);
  p2 = starPt(i + 1, pts, rOut, rIn, rot);
  return { x: p1.x + (p2.x - p1.x) * f, y: p1.y + (p2.y - p1.y) * f };
}

function shp(){ return SHAPES[S.shape] || SHAPES[0]; }

/* t = 0..1 raaste par kahan ho. Har shape ke liye ek hi interface. */
function pathAt(t){
  var id = shp().id, a, seg, f, k, tip, th;
  if (t < 0) t = 0;
  if (t > 1) t = 1;
  if (id === "line") return { x: A.x0 + t * (A.x1 - A.x0), y: A.cy };
  if (id === "vert") return { x: A.cx, y: A.y1 - t * (A.y1 - A.y0) };
  if (id === "ring") {
    a = -Math.PI / 2 + t * Math.PI * 2;
    return { x: A.cx + Math.cos(a) * A.r, y: A.cy + Math.sin(a) * A.r };
  }
  if (id === "cross") {
    /* 8 tukde: markaz -> nok -> markaz, chaar baar. Raasta kabhi tootta nahi. */
    seg = Math.floor(t * 8); if (seg > 7) seg = 7;
    f = t * 8 - seg;
    k = (seg % 2 === 0) ? f : 1 - f;
    tip = CROSS_TIPS[Math.floor(seg / 2)];
    return { x: A.cx + tip[0] * A.arm * k, y: A.cy + tip[1] * A.arm * k };
  }
  if (id === "tri")  return polyAt(t, 3, A.pr, -Math.PI / 2);
  if (id === "sqr")  return polyAt(t, 4, A.pr,  Math.PI / 4);
  if (id === "hex")  return polyAt(t, 6, A.pr,  0);
  if (id === "star") return starAt(t, 5, A.so, A.si, -Math.PI / 2);
  if (id === "wave") return { x: A.x0 + t * (A.x1 - A.x0),
                              y: A.cy + A.wa * Math.sin(t * Math.PI * 3) };
  /* infinity - Gerono lemniscate */
  th = t * Math.PI * 2;
  return { x: A.cx + A.iw * Math.cos(th), y: A.cy + A.ih * Math.sin(2 * th) };
}

var lastAng = 0;
function tangentAt(t){
  /* FIX: X CROSS ke nok aur markaz par dono sample points barabar aa jate the,
     atan2(0,0) = 0 -> object achanak flat ho jata tha. Ab epsilon barhta hai. */
  var e = 0.005, a, b, p, q, dx, dy, k;
  for (k = 0; k < 4; k++) {
    a = t - e; b = t + e;
    if (shp().wrap) { if (a < 0) a += 1; if (b > 1) b -= 1; }
    else            { if (a < 0) a = 0;  if (b > 1) b = 1;  }
    p = pathAt(a); q = pathAt(b);
    dx = q.x - p.x; dy = q.y - p.y;
    if (dx * dx + dy * dy > 0.02) { lastAng = Math.atan2(dy, dx); return lastAng; }
    e *= 3;
  }
  return lastAng;
}

    var mobileW = (W - inset * 2 - gap * 2) / 3;
    return { x: inset + col * (mobileW + gap), y: ROW_Y[row], w: mobileW, h: TH };
  }
  return { x: TX0 + col * (TW + GX), y: ROW_Y[row], w: TW, h: TH };
}

function shopTabBox(index){
  var left = IS_MOBILE ? Math.ceil(MOBILE_CROP_X + 8) : 10;
  var right = IS_MOBILE ? Math.floor(W - MOBILE_CROP_X - 8) : 440;
  var gap = IS_MOBILE ? 4 : 2;
  var width = (right - left - gap * 3) / 4;
  return { x:left + index * (width + gap), y:99, w:width, h:40 };
}

function shopTabRailBox(){
  var first = shopTabBox(0), last = shopTabBox(3);
  return { x:first.x - 3, y:96, w:last.x + last.w - first.x + 6, h:46 };
}


/* ----------------------------------------------------------
   5. AUDIO - poori tarah code se banti hai, 0 bytes ki files
   ---------------------------------------------------------- */
var AC = null, master = null, drone = null, droneGain = null;
var mTimer = 0, mStep = 0, beat = 0;
var SCALE = [0,3,5,7,10], ROOT = 220;

function initAudio(){
  if (AC) { if (AC.state === "suspended") { try { AC.resume(); } catch(e){} } return; }
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = 0.9;
    master.connect(AC.destination);

    droneGain = AC.createGain();
    droneGain.gain.value = 0;
    var lp = AC.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 220;
    drone = AC.createOscillator();
    drone.type = "triangle";
    drone.frequency.value = 44;
    drone.connect(lp); lp.connect(droneGain); droneGain.connect(master);
    drone.start();
    applyAudioGate();
  } catch(e){ AC = null; }
}

function hz(semi){ return ROOT * Math.pow(2, semi / 12); }

function blip(freq, dur, type, vol){
  if (!AC || !audioAllowed() || paused) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.18, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}

function noise(dur, cut, vol, q){
  if (!AC || !audioAllowed() || paused) return;
  try {
    var n = Math.floor(AC.sampleRate * dur), i;
    var buf = AC.createBuffer(1, n, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = cut || 1200; f.Q.value = q || 1;
    var g = AC.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  } catch(e){}
}

/* NAYA SOUNDTRACK: narm house beat + warm bass pluck + saaf arp melody
   (purana beat har step par shor karta tha, ab groove hai) */
var BASSLINE = [0, 0, 7, 3, 5, 5, 10, 7];
var ARP      = [12, 19, 24, 19, 15, 22, 27, 22, 12, 17, 24, 17, 14, 21, 26, 21];

function musicTick(dt){
  if (!AC || !audioAllowed() || paused) return;
  if (S.phase !== "run" && S.phase !== "idle") return;
  var period = Math.max(0.105, 0.34 - S.level * 0.009);   /* level ke sath tempo tez */
  mTimer += dt;
  if (mTimer < period) return;
  mTimer = 0;
  mStep = (mStep + 1) % 16;
  beat++;
  var bar16 = Math.floor(beat / 16);

  /* KICK - sirf step 1 aur 9 par, gehra aur narm */
  if (mStep === 0 || mStep === 8) {
    try {
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = "sine";
      o.frequency.setValueAtTime(64, t);
      o.frequency.exponentialRampToValueAtTime(34, t + 0.16);
      g.gain.setValueAtTime(0.26, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.22);
    } catch(e){}
  }

  /* HATS - bohot halke (pehle har doosre step par shor tha) */
  if (mStep === 4 || mStep === 12) noise(0.045, 5600, 0.026, 2.2);
  else if (mStep % 4 === 2)        noise(0.028, 9500, 0.013, 4.0);

  /* BASS pluck - warm sine, har 4 step par, pattern badalta rehta hai */
  if (mStep % 4 === 0) {
    blip(hz(BASSLINE[((mStep / 4) + bar16) % BASSLINE.length] - 12), 0.22, "sine", 0.15);
  }

  /* MELODY arp - level 3 se, saaf triangle, dheemi awaz */
  if (S.level >= 3 && mStep % 2 === 1) {
    blip(hz(ARP[mStep % ARP.length] + (S.level >= 12 ? 12 : 0)), 0.13, "triangle", 0.050);
  }

  /* perfect chain par chhoti chamakti ghanti */
  if (S.chain >= 3 && mStep % 8 === 6) blip(hz(36), 0.16, "sine", 0.05);
  if (droneGain && drone) {
    try {
      drone.frequency.value = 44 + S.level * 1.6;
      droneGain.gain.value = (S.level >= 3) ? Math.min(0.070, (S.level - 2) * 0.008) : 0.018;
    } catch(e){}
  }
}

function later(ms, fn){ setTimeout(fn, ms); }

function sfxHit(perfect){
  var n = Math.min(S.chain, 7), base = SCALE[n % SCALE.length];
  /* ghanti jaisi saaf awaz - purana square beep katora lagta tha */
  blip(hz(base + (perfect ? 24 : 19)), perfect ? 0.20 : 0.14, "triangle", perfect ? 0.17 : 0.12);
  blip(hz(base + (perfect ? 31 : 26)), perfect ? 0.26 : 0.17, "sine",     perfect ? 0.11 : 0.07);
  if (perfect) later(60, function(){ blip(hz(base + 36), 0.22, "sine", 0.08); });
}

                 r: 2 + Math.random()*3.5, col: col, life: lf, max: lf });

  if (parts.length > 260) parts.splice(0, parts.length - 260);
}

   7. GAME STATE

var TT = 0, slowT = 0, idleT = 0, last = 0;

var S = {
  screen:"game", phase:"idle", shopTab:"char",
  banked:0, pot:0, level:0, lives:CFG.lives,
  pos:0, dir:1, zoneA:0.3, zoneW:CFG.baseZone, speed:CFG.baseSpeed, shape:0,
  flash:0, shake:0, happyT:0, blink:0, zoom:0, chain:0,
  msg:"", msgSub:"", msgT:0,
  mile:"", mileSub:"", mileT:0,
  missT:0, missGap:0, missPos:0,
  coinsRun:0, newBest:false, maxSpeedReward:false,
  slowHits:0, doubleHits:0, shieldActive:false, reviveActive:false,
  shopMsg:"", shopMsgT:0, buyFlash:0
};


/* ----------------------------------------------------------
   8. THE CORE LOOP
   ---------------------------------------------------------- */
function applyLevel(){
  var diff = S.level % 3;
  var effLevel = diff * 4 + (S.shape * 0.2); // 0 (Easy), 4 (Middle), 8 (Hard)
  
  /* Gentle opening with progressively stronger acceleration, capped at 5. */
  S.speed = Math.min(CFG.maxSpeed,
    CFG.baseSpeed + S.level * CFG.speedStep + S.level * S.level * CFG.speedCurve);
  /* Shrink the target smoothly after every successful hit as speed rises. */
  S.zoneW = Math.max(CFG.minZone, CFG.baseZone * Math.pow(CFG.zoneShrink, S.level));
  
  /* level 20+ : zone khud bhi sarakta hai - speed cap ke baad bhi game barhta rehta hai */
  S.drift = (effLevel >= CFG.driftFrom)
    ? (Math.random() < 0.5 ? -1 : 1) * Math.min(0.20, CFG.driftRate * (1 + (effLevel - CFG.driftFrom) * 0.08))
    : 0;
}

function placeZone(){
  var m = shp().wrap ? 0.02 : 0.035;
  var span = 1 - S.zoneW - m * 2;
  if (span < 0) span = 0;

  /* FIX (fairness): marker hamesha t=0 se chalta hai. Pehle zone bilkul start ke
     paas bhi ban sakta tha -> level 14 par sirf 24ms react time. Ab minimum
     reaction window guarantee hai. */
  var need = S.speed * CFG.minReact + S.zoneW / 2;
  var maxMid = m + span + S.zoneW / 2;
  if (need > maxMid * 0.92) need = maxMid * 0.92;

  var lo = need - S.zoneW / 2;
  if (lo < m) lo = m;
  var hi = m + span;
  if (hi < lo) hi = lo;
  S.zoneA = lo + Math.random() * (hi - lo);

  S.zoneIn = 0;      /* naya zone chhota se bara ho kar aata hai */
  trail.length = 0;
}

function say(t, sub){ S.msg = t; S.msgSub = sub || ""; S.msgT = 1.7; }
function banner(t, sub){ S.mile = t; S.mileSub = sub || ""; S.mileT = 1.6; }
function shopSay(t){ S.shopMsg = t; S.shopMsgT = 1.8; }

function gainFor(perfect){
  var g = 1 + Math.floor(S.level / 2);
  if (perfect) g *= 2;
  if (S.chain >= 3) g += Math.floor(S.chain / 3);
  if (S.doubleHits > 0) g *= 2;
  return g;
}

/* Shortest screen-space distance from a point on the track to a path section.
   Needed by X because its arms are deliberately travelled in both directions. */
function distanceToPathSection(point, from, to, steps){
  var best = Infinity, prev = pathAt(from), cur, i, vx, vy, wx, wy, vv, u, px, py, dx, dy;
  for (i = 1; i <= steps; i++) {
    cur = pathAt(from + (to - from) * (i / steps));
    vx = cur.x - prev.x; vy = cur.y - prev.y;
    wx = point.x - prev.x; wy = point.y - prev.y;
    vv = vx * vx + vy * vy;
    u = vv > 0 ? (wx * vx + wy * vy) / vv : 0;
    if (u < 0) u = 0; else if (u > 1) u = 1;
    px = prev.x + vx * u; py = prev.y + vy * u;
    dx = point.x - px; dy = point.y - py;
    best = Math.min(best, Math.sqrt(dx * dx + dy * dy));
    prev = cur;
  }
  return best;
}

/* Visible half-size of each moving object along the direction of travel. */
function movingObjectHitRadius(){
  if (objId === "orb") return 12;
  if (objId === "arrow") return 16;
  if (objId === "diamond") return 15;
  if (objId === "blade") return 20;
  if (objId === "comet") return 11;
  return 4; /* bar / needle */
}

function newRun(){
  adReviveUsed = false;
  S.phase = "idle"; S.banked = 0; S.pot = 0; S.level = 0; S.lives = CFG.lives;
  S.pos = 0; S.dir = 1; S.chain = 0; 
  var sidx = SHAPES.findIndex(function(s) { return s.id === shapeId; });
  S.shape = sidx >= 0 ? sidx : 0;
  S.coinsRun = 0; S.newBest = false; S.maxSpeedReward = false;
  S.slowHits = 0; S.doubleHits = 0; S.shieldActive = false; S.reviveActive = false;
  S.zoneIn = 0; S.wash = 0; S.potPunch = 0; S.washCol = "#ffffff";
  shocks.length = 0; coinsFly.length = 0;
  S.flash = 0; S.shake = 0; S.happyT = 0; S.zoom = 0;
  S.missT = 0; S.mileT = 0;
  lastSentScore = -1;
  parts.length = 0; pops.length = 0; trail.length = 0; stops.length = 0;
  applyLevel();
  placeZone();
  say("TAP TO STOP THE LINE", "3 LIVES - CASH OUT EARLY");
}

function gameOver(){
  S.phase = "over";
  deaths++;              /* FIX: ad gate ab game-over ginta hai, har life nahi */
  sfxMiss();
  if (S.banked > best) { best = S.banked; S.newBest = true; }
  sendScore(S.banked);
  queueSave();
  maybeAd();
  if (S.newBest) {
    var cc = ["#ffd166", "#22d3a6", "#38bdf8", "#ff4d8d", "#a855f7"], ci;
    for (ci = 0; ci < 5; ci++) burst(55 + ci * 85, 150, 14, cc[ci], 330);
    wash("#ffd166");
  }
}

function stopLine(){
  if (S.phase === "over" || S.phase === "miss") return;
  if (S.phase === "idle") S.phase = "run";

  var half = S.zoneW / 2;
  var mid  = S.zoneA + half;
  var d    = S.pos - mid;
  if (shp().wrap) { if (d > 0.5) d -= 1; if (d < -0.5) d += 1; }
  var ad = Math.abs(d);
  var hit = ad <= half;
  var m, i, forced, perfect, g, close, markerPoint, perfectA, perfectB;

  /* Match the visible target on every shape: the full highlighted section is a
     valid hit, while only its small gold centre awards PERFECT. Screen-space
     checking also handles corners and overlapping X arms correctly. */
  markerPoint = pathAt(S.pos);
  /* Include the target's visible half-width and rounded end caps. A moving
     object touching any green pixel is therefore accepted as a hit. */
  hit = distanceToPathSection(markerPoint, S.zoneA, S.zoneA + S.zoneW, 48)
        <= shp().lw / 2 + movingObjectHitRadius();
  perfectA = mid - half * CFG.perfectBand;
  perfectB = mid + half * CFG.perfectBand;

  if (hit) {
    perfect = distanceToPathSection(markerPoint, perfectA, perfectB, 16) <= 4;
    if (perfect) S.chain++; else S.chain = 0;
    g = gainFor(perfect);
    S.pot += g;
    if (S.slowHits > 0) S.slowHits--;
    if (S.doubleHits > 0) S.doubleHits--;
    S.level++;
    if (S.level > bestLevel) { bestLevel = S.level; queueSave(); }
    S.happyT = 0.5; S.zoom = 1; S.flash = perfect ? 0.55 : 0.30;
    m = pathAt(S.pos);
    burst(m.x, m.y, IS_MOBILE ? (perfect ? 12 : 8) : (perfect ? 26 : 14), perfect ? "#ffd166" : tier().col, perfect ? 300 : 200);
    shock(m.x, m.y, perfect ? "#ffd166" : tier().col, !!perfect);
    coinFly(m.x, m.y, Math.min(9, 2 + Math.floor(g / 2)));
    if (S.chain >= 3) burst(m.x, m.y, IS_MOBILE ? 5 : 10, "#ffd166", 170);
    pop("+" + g, 225, 262, perfect ? "#ffd166" : "#ffffff", perfect ? 26 : 21);
    say(perfect ? "PERFECT!" : "GOOD", S.chain >= 2 ? ("CHAIN x" + S.chain) : "");
    sfxHit(perfect);
    buzz(perfect ? [12,18,12] : 18);
    slowT = 0;   /* FIX: pehle perfect hit slow-motion deta tha -> agla round asaan ho jata tha (ulta inaam) */
    stops.push({ t:S.pos, ok:true, life:1.5 });
    if (stops.length > 6) stops.shift();

    if (MILESTONES[S.level]) { banner(MILESTONES[S.level], "LEVEL " + S.level); sfxMile(); buzz([20,40,20,40]); wash(tier().col); }

    /* The shape is now exclusively driven by the Shop selection. S.shape is updated in buyOrEquip() and initGame(). */

    applyLevel();
    if (S.speed >= CFG.maxSpeed && !S.maxSpeedReward) {
      S.maxSpeedReward = true;
      wallet += 5000;
      S.coinsRun += 5000;
      banner("MAX SPEED!", "BONUS 5000 COINS");
      burst(225, A.cy, IS_MOBILE ? 20 : 45, "#ffd166", 340);
      sfxCash();
      buzz([20,35,20,35,60]);
      queueSave();
    }
    S.pos = 0; S.dir = 1;
    placeZone();

  } else {
    if (S.shieldActive) {
      S.shieldActive = false;
      S.chain = 0;
      S.flash = 0.35;
      m = pathAt(S.pos);
      burst(m.x, m.y, IS_MOBILE ? 10 : 24, "#22d3a6", 240);
      shock(m.x, m.y, "#22d3a6", true);
      say("SHIELDED!", "NO LIFE OR COINS LOST");
      sfxEquip(); buzz([15,25,15]);
      S.phase = "run";
      S.pos = 0; S.dir = 1;
      placeZone();
      queueSave();
      return;
    }
    S.lives--;
    S.missPos = S.pos;
    S.missGap = ad - half;
    stops.push({ t:S.pos, ok:false, life:1.5 });
    if (stops.length > 6) stops.shift();
    S.pot = 0;
    S.chain = 0;
    S.flash = 0.85; S.shake = 1;
    close = ad <= half + CFG.closeMargin;
    m = pathAt(S.pos);
    burst(m.x, m.y, IS_MOBILE ? 9 : 20, "#ff4d5e", 240);
    shock(m.x, m.y, "#ff4d5e", true);
    wash("#ff4d5e");
    pop("-1 LIFE", 225, 262, "#ff4d5e", 22);
    sfxLife();
    buzz(close ? 60 : 120);

    if (S.lives <= 0 && S.reviveActive) {
      S.reviveActive = false;
      S.lives = 1;
      say("REVIVED!", "1 LIFE RESTORED");
      banner("SECOND CHANCE", "REVIVE USED");
      S.phase = "miss";
      S.missT = CFG.missFreeze;
      sfxCash(); buzz([20,35,20,50]);
      queueSave();
    } else if (S.lives <= 0) {
      S.lives = 0;
      if (!adReviveUsed) {
        S.phase = "ad_revive";
      } else {
        gameOver();
      }
    } else {
      say(close ? "SO CLOSE" : "MISSED", S.lives + (S.lives === 1 ? " LIFE LEFT" : " LIVES LEFT"));
      S.phase = "miss";
      S.missT = CFG.missFreeze;
    }
  }
}

function cashOut(){
  if (S.pot <= 0) { say("NOTHING TO BANK", ""); sfxDeny(); return; }
  var v = S.pot;
  S.pot = 0;
  S.banked   += v;
  wallet     += v;
  S.coinsRun += v;
  if (S.banked > best) { best = S.banked; S.newBest = true; }
  sendScore(S.banked);
  queueSave();
  burst(225, 288, 30, "#22d3a6", 280);
  pop("+" + v + " BANKED", 225, 250, "#22d3a6", 24);
  say("BANKED " + v, "COINS +" + v);
  sfxCash(); buzz([15,30,15,30,40]);
  S.chain = 0;
  S.phase = "run";
  S.pos = 0; S.dir = 1;
  placeZone();
}

function buyOrEquip(kind, idx){
  var list = (kind === "char") ? CHARS : (kind === "obj" ? OBJS : (kind === "bg" ? BGS : (kind === "power" ? POWERS : SHAPES)));
  var it = list[idx];
  if (!it) return;

  if (kind === "power") {
    if (wallet < it.price) {
      shopSay("NEED " + (it.price - wallet) + " MORE COINS");
      sfxDeny(); buzz(40);
      return;
    }
    wallet -= it.price;
    POWER_STOCK[it.id] += it.amount;
    shopSay(it.name + " BOUGHT - " + POWER_STOCK[it.id] + " READY");
    sfxBuy(); buzz([15,25,15]);
    b = tileBox(kind, idx);
    burst(b.x + b.w / 2, b.y + 40, 22, it.col, 220);
    queueSave();
    return;
  }
  var key = kind + ":" + it.id;
  var owned = !!OWNED[key] || it.price === 0;
  var b;

  if (!owned) {
    if (wallet < it.price) {
      shopSay("NEED " + (it.price - wallet) + " MORE COINS");
      sfxDeny(); buzz(40);
      return;
    }
    wallet -= it.price;
    OWNED[key] = true;
    shopSay("BOUGHT " + it.name + " - " + wallet + " COINS LEFT");
    sfxBuy(); buzz([15,25,15]);
    S.buyFlash = 1;
    b = (kind === "shape") ? levTileBox(idx) : tileBox(kind, idx);
    burst(b.x + b.w / 2, b.y + 40, 22, it.col || "#22d3a6", 220);
    queueSave();
    return;
  }

  if (kind === "char") charId = it.id; else if (kind === "obj") objId = it.id; else if (kind === "bg") bgId = it.id; else shapeId = it.id;
  
  if (kind === "shape") {
      var sidx = SHAPES.findIndex(function(s) { return s.id === shapeId; });
      S.shape = sidx >= 0 ? sidx : 0;
  }
  
  shopSay(it.name + " EQUIPPED");
  sfxEquip(); buzz(15);
  queueSave();
}

function toLocal(src){
  var r = cvs.getBoundingClientRect();
  var cx = (src.clientX !== undefined) ? src.clientX : 0;
  var cy = (src.clientY !== undefined) ? src.clientY : 0;
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}
function hitBox(p, b){ return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

function activatePower(id){
  if (S.phase === "over" || S.phase === "miss" || S.phase === "ad_revive") { say("NOT RIGHT NOW", "START OR CONTINUE THE RUN"); sfxDeny(); return; }
  if (POWER_STOCK[id] <= 0) { say("NO " + id.toUpperCase(), "BUY IT IN THE SHOP"); sfxDeny(); buzz(35); return; }
  if ((id === "slow" && S.slowHits > 0) ||
      (id === "double" && S.doubleHits > 0) ||
      (id === "shield" && S.shieldActive) ||
      (id === "revive" && S.reviveActive)) {

  }

  POWER_STOCK[id]--;
  if (id === "slow") S.slowHits = 5;
  else if (id === "double") S.doubleHits = 5;
  else if (id === "shield") S.shieldActive = true;
  else if (id === "revive") S.reviveActive = true;
  say(id === "double" ? "DOUBLE COINS!" : id.toUpperCase() + " ACTIVE",
      (id === "slow" || id === "double") ? "NEXT 5 HITS" : "READY FOR ONE USE");

function press(e){
  var now = Date.now(), p, i, b;

  /* mobile double-fire guard: touchstart ke baad synthetic mousedown aata hai */
  if (e.type === "touchstart") lastTouch = now;
  else if (now - lastTouch < 600) return;

  if (e.cancelable) e.preventDefault();
  initAudio();
  if (!gameReadySent || paused) return;

  if (e.type === "touchstart" && e.changedTouches && e.changedTouches.length) p = toLocal(e.changedTouches[0]);
  else p = toLocal(e);

  if (S.screen === "levels") {
    for (var i = 0; i < SHAPES.length; i++) {
      var b = levTileBox(i);
      if (hitBox(p, b)) { buyOrEquip("shape", i); return; }
    }
    if (hitBox(p, LBACK)) { S.screen = "game"; sfxOpen(); }
    return;
  }

  if (S.screen === "shop") {
    if (p.y >= 96 && p.y <= 142) {
      for (var tabIndex = 0; tabIndex < 4; tabIndex++) {
        if (hitBox(p, shopTabBox(tabIndex))) {
          S.shopTab = ["char", "obj", "bg", "power"][tabIndex];
          sfxOpen();
          return;
        }
      }
    }
    var list = (S.shopTab === "char") ? CHARS : (S.shopTab === "obj" ? OBJS : (S.shopTab === "bg" ? BGS : POWERS));
    for (i = 0; i < list.length; i++) { 
      b = tileBox(S.shopTab, i); 
      if (hitBox(p, b)) { buyOrEquip(S.shopTab, i); return; } 
    }
    if (hitBox(p, BACK)) { S.screen = "game"; sfxOpen(); }
    return;
  }

  if (!IN_YT && hitBox(p, SND)) { userSound = !userSound; applyAudioGate(); return; }

  for (i = 0; i < POWER_BTNS.length; i++) {
    b = powerButtonBox(POWER_BTNS[i]);
    if (hitBox(p, b)) { activatePower(b.id); return; }
  }

  if (hitBox(p, LEVB)) { S.screen = "levels"; sfxOpen(); return; }

  /* Ad Revive popup buttons */
  if (S.phase === "ad_revive") {
    if (hitBox(p, AD_REVIVE_BTN_WATCH)) {
      AdManager.showRewarded(
        function() {
          /* Reward earned - revive player */
          adReviveUsed = true;
          S.lives = 1;
          S.phase = "miss";
          S.missT = CFG.missFreeze;
          say("REVIVED!", "1 LIFE RESTORED");
          banner("SECOND CHANCE", "AD REVIVE USED");
          sfxCash(); buzz([20,35,20,50]);
          queueSave();
        },
        function() {
          /* Ad dismissed without reward */
          gameOver();
        }
      );
      return;
    }
    if (hitBox(p, AD_REVIVE_BTN_NO)) {
      gameOver();
      return;
    }
    return;
  }

  if (S.phase === "over") {
    if (hitBox(p, SHOPB)) { S.screen = "shop"; sfxOpen(); return; }
    newRun();
    return;
  }

  if (S.phase === "idle" && hitBox(p, SHOPB)) { S.screen = "shop"; sfxOpen(); return; }

  if (hitBox(p, CASH)) { cashOut(); return; }

  stopLine();
}

window.addEventListener("keydown", function(e){
  if (!gameReadySent) return;
  if (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter") {
    e.preventDefault();
    initAudio();
    if (S.screen === "shop" || S.screen === "levels") { S.screen = "game"; return; }

});

function resize(){
  var vw = window.innerWidth  || W;
  var vh = window.innerHeight || H;
  /* Mobile uses proportional cover: full height, larger UI, no empty bands. */
  var sc = IS_MOBILE ? Math.max(vw / W, vh / H) : Math.min(vw / W, vh / H);
  /* Match the enlarged CSS canvas with a high-density backing store. */
  var dpr = Math.min((window.devicePixelRatio || 1) * sc, 3);
  var sidebarW = 86;
  var btnW = 74, btnH = 54, btnGap = 6;
  if (IS_MOBILE) {
    MOBILE_CROP_X = Math.max(0, (W - vw / sc) / 2);
    var sideX = Math.ceil(MOBILE_CROP_X + 12);
    HUD_LEFT = Math.round(MOBILE_CROP_X);
    HUD_TOP_PAD = 8;
    HUD_COIN_W = sidebarW; HUD_LIVES_W = sidebarW;
    SND.w = 70;
    SND.x = W - sideX - SND.w;
    SND.y = 16 + HUD_TOP_PAD;
    /* Keep the thick track and its glow inside the visible phone safe area. */
    A.x0 = Math.max(38, sideX + 16);
    A.x1 = W - sideX - 16;
    A.y0 = 378; A.y1 = 562;
    var pTop = 84 + HUD_TOP_PAD + 8;
    POWER_BTNS.forEach(function(button, index){
      button.w = btnW; button.h = btnH;
      button.x = HUD_LEFT + Math.round((sidebarW - btnW) / 2);
      button.y = pTop + 6 + index * (btnH + btnGap);
    });
    var actionGap = 9, actionLeft = sideX, actionRight = W - sideX;
    var actionSpace = actionRight - actionLeft - actionGap * 2;
    CASH.x = actionLeft; CASH.w = actionSpace * 0.48;
    SHOPB.x = CASH.x + CASH.w + actionGap; SHOPB.w = actionSpace * 0.26;
    LEVB.x = SHOPB.x + SHOPB.w + actionGap; LEVB.w = actionRight - LEVB.x;
  } else {
    MOBILE_CROP_X = 0;
    HUD_LEFT = 0;
    HUD_TOP_PAD = 4;
    HUD_COIN_W = sidebarW; HUD_LIVES_W = sidebarW;
    SND.w = 74;
    SND.x = W - 8 - SND.w;
    SND.y = 16 + HUD_TOP_PAD;
    A.x0 = 45; A.x1 = 405; A.y0 = 378; A.y1 = 562;
    var pTop = 84 + HUD_TOP_PAD + 8;
    POWER_BTNS.forEach(function(button, index){
      button.w = btnW; button.h = btnH;
      button.x = HUD_LEFT + Math.round((sidebarW - btnW) / 2);
      button.y = pTop + 6 + index * (btnH + btnGap);
    });
    CASH.x = 45; CASH.w = 168;
    SHOPB.x = 223; SHOPB.w = 88;
    LEVB.x = 321; LEVB.w = 84;
  }
  cvs.width  = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  RENDER_SCALE = dpr;
  TRACK_FRAME = null;
  POWER_ICON_FRAMES = {};
  ZONE_FRAME = null; NEEDLE_FRAME = null;
  EFFECT_FRAMES.clear();
  /* Uniform scaling keeps circles and characters undistorted. */
  cvs.style.width  = Math.round(W * sc) + "px";
  cvs.style.height = Math.round(H * sc) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  try { ctx.imageSmoothingQuality = "high"; } catch(e){}
  ctx.textBaseline = "middle";
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function(){ setTimeout(resize, 120); });

function rr(x, y, w, h, r){
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);     ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);     ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
  ctx.lineTo(x, y + r);         ctx.quadraticCurveTo(x, y,         x + r, y);
  ctx.closePath();
}

function text(t, x, y, size, color, align, sp){
  ctx.save();
  ctx.font = "700 " + size + "px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  ctx.fillStyle = color || "#e9edf5";
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  if (sp) { try { ctx.letterSpacing = sp + "px"; } catch(e){} }
  ctx.fillText(t, x, y);
  ctx.restore();
}

var TRACK = ["#252f5c", "#1c5573", "#1a6b56", "#6b5a1a", "#6b2340"];
function hx(c){
  return [parseInt(c.substr(1,2),16), parseInt(c.substr(3,2),16), parseInt(c.substr(5,2),16)];
}
function mix(a, b, t){
  var A = hx(a), B = hx(b);
  return "rgb(" + Math.round(A[0]+(B[0]-A[0])*t) + "," +
                 Math.round(A[1]+(B[1]-A[1])*t) + "," +
                 Math.round(A[2]+(B[2]-A[2])*t) + ")";
}
function trackCol(t){
  var n = TRACK.length - 1;
  var i = Math.min(n - 1, Math.max(0, Math.floor(t * n)));
  return mix(TRACK[i], TRACK[i+1], t * n - i);
}

/* Ek hi function har shape ka raasta bana deta hai. */
function strokePath(from, to, steps){
  var i, t, p;
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    t = from + (to - from) * (i / steps);
    p = pathAt(t);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
}

/* raaste ke samandar-samandar (normal ke saath) shift kar ke stroke */
function strokePathOffset(from, to, steps, off){
  var i, t, p, ang, x, y;
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    t = from + (to - from) * (i / steps);
    p = pathAt(t); ang = tangentAt(t);
    x = p.x - Math.sin(ang) * off;
    y = p.y + Math.cos(ang) * off;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

/* raaste ke aar-paar khadi chhoti lakeer (tick / zone post) */
function crossTick(t, len, w, col, alpha){
  var p = pathAt(t), ang = tangentAt(t);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);
  ctx.fillStyle = col;
  rr(-w / 2, -len / 2, w, len, w / 2);
  ctx.fill();
  ctx.restore();
}

/* chalti hui chevron - direction batati hai */
function chevron(t, col, alpha, sc){
  var p = pathAt(t), ang = tangentAt(t);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.4 * sc;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(-4 * sc, -5 * sc);
  ctx.lineTo( 3 * sc, 0);
  ctx.lineTo(-4 * sc, 5 * sc);
  ctx.stroke();
  ctx.restore();
}

function drawTrack(){
  var lw = shp().lw;
  if (CFG.barStyle === "pro")     { drawTrackPro(lw);     return; }
  if (CFG.barStyle === "flat")    { drawCachedTrack(lw);  return; }
  if (CFG.barStyle === "segment") { drawTrackSegment(lw); return; }
  if (CFG.barStyle === "neon")    { drawTrackNeon(lw);    return; }
  drawTrackGlass(lw);
}

/* STYLE 5 - "pro" (naya default): saaf slate bar + tier rang ki progress fill.
   koi rainbow gradient nahi, is liye game ke dark neon theme se sabse zyada match karta hai. */
function drawTrackPro(lw){
  var T = tier(), segs = 90, i, a, b, upto = S.pos;
  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  /* bahri narm glow */
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = T.col;
  ctx.shadowColor = T.glow + "0.90)"; ctx.shadowBlur = 26;
  ctx.lineWidth = lw + 11;
  strokePath(0, 1, 60);
  ctx.shadowBlur = 0;

  /* housing - neutral slate, saaf aur premium */
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#161d2e";
  ctx.lineWidth = lw + 4;
  strokePath(0, 1, 70);
  ctx.strokeStyle = "#0a0f1c";
  ctx.lineWidth = lw;
  strokePath(0, 1, 70);

  /* andar halka shade - gehrai */
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = "#151d30";
  ctx.lineWidth = lw * 0.50;
  strokePathOffset(0, 1, 70, -(lw * 0.22));
  ctx.globalAlpha = 1;

  /* progress fill - start se marker tak tier rang bharta jata hai */
  if (upto > 0.006) {
    for (i = 0; i < segs; i++) {
      a = (i / segs) * upto;
      b = ((i + 1.25) / segs) * upto;
      if (b > upto) b = upto;
      ctx.globalAlpha = 0.16 + 0.72 * (i / segs);
      ctx.strokeStyle = T.col;
      ctx.lineWidth = lw * 0.70;
      strokePath(a, b, 2);
    }
    ctx.globalAlpha = 1;
  }

  /* 8 saaf tick lakeeren */
  for (i = 1; i < 8; i++) crossTick(i / 8, lw * 0.44, 1.4, "#ffffff", 0.07);

  /* upar chamak + patli rim light */
  ctx.globalAlpha = 0.11;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = lw * 0.20;
  strokePathOffset(0, 1, 70, -(lw * 0.30));
  ctx.globalAlpha = 0.14;
  ctx.lineWidth = 1.2;
  strokePathOffset(0, 1, 70, -(lw * 0.5 - 0.8));
  strokePathOffset(0, 1, 70,  (lw * 0.5 - 0.8));

  ctx.restore();
}

/* STYLE 1 - "segment": LED khanay. Position parhna sabse asaan. */
function drawTrackSegment(lw){
  var n = 24, i, a, b, c, g = 0.0024;
  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 22;
  ctx.strokeStyle = "#05070d";
  ctx.lineWidth = lw + 13;
  strokePath(0, 1, 80);
  ctx.shadowBlur = 0;

  ctx.strokeStyle = "#0d1424";
  ctx.lineWidth = lw + 2;
  strokePath(0, 1, 80);

  ctx.lineCap = "butt";
  for (i = 0; i < n; i++) {
    a = i / n + g; b = (i + 1) / n - g;
    c = trackCol((i + 0.5) / n);
    ctx.strokeStyle = c;
    ctx.globalAlpha = 0.24;
    ctx.lineWidth = lw * 0.90;
    strokePath(a, b, 3);
    ctx.globalAlpha = 0.92;
    ctx.shadowColor = c; ctx.shadowBlur = 12;
    ctx.lineWidth = lw * 0.24;
    strokePath(a, b, 3);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

/* STYLE 2 - "neon": khokhla track, do chamakti rails. */
/* hex colour ko kaale ki taraf dabana - shafaf (alpha) fill ke bajaye thos rang,
   is se overlap ki lakeeren (seams) nahi banti */
/* STYLE 4 - "flat": saaf thos gradient bar + safed outline zone (user ki pasand). */
function drawTrackFlat(lw){
  var segs = 120, i, a, b, T = tier();
  if (shp().id === "cross") { drawCrossTrackFlat(lw, T); return; }
  if (shp().id === "tri") { drawPolygonTrackFlat(lw, T, 3, -Math.PI / 2); return; }
  if (shp().id === "sqr") { drawPolygonTrackFlat(lw, T, 4,  Math.PI / 4); return; }
  if (shp().id === "hex") { drawPolygonTrackFlat(lw, T, 6, 0); return; }
  if (shp().id === "star") { drawStarTrackFlat(lw, T); return; }
  ctx.save();
  ctx.lineJoin = "round";

  /* tier ke rang ka bahri glow - game ke neon theme se match karta hai */
  ctx.lineCap = "round";
  ctx.globalAlpha = 0.20;
  ctx.strokeStyle = T.col;
  ctx.shadowColor = T.glow + "0.95)"; ctx.shadowBlur = 30;
  ctx.lineWidth = lw + 12;
  strokePath(0, 1, 60);
  ctx.shadowBlur = 0;

  /* neeche gehra saya - bar utthi hui lagti hai */
  ctx.globalAlpha = 0.60;
  ctx.strokeStyle = "#03050a";
  ctx.shadowColor = "rgba(0,0,0,0.90)"; ctx.shadowBlur = 16;
  ctx.lineWidth = lw + 5;
  strokePath(0, 1, 60);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  /* thos hamwar gradient - opaque rang, is liye koi seam nahi banta */
  ctx.lineCap = "butt";
  for (i = 0; i < segs; i++) {
    a = i / segs; b = (i + 1.25) / segs; if (b > 1) b = 1;
    ctx.strokeStyle = trackCol(a);
    ctx.lineWidth = lw;
    strokePath(a, b, 2);
  }

  /* dono sire gol */
  ctx.lineCap = "round";
  ctx.strokeStyle = trackCol(0);     strokePath(0, 0.009, 2);
  ctx.strokeStyle = trackCol(0.999); strokePath(0.991, 1, 2);



  /* kinaron par patli roshni */
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.1;
  strokePathOffset(0, 1, 70, -(lw * 0.5 - 0.6));
  strokePathOffset(0, 1, 70,  (lw * 0.5 - 0.6));

  ctx.restore();
}

/* Draw the X as two equal bars. The movement path revisits the centre several
   times, so using strokePath() for the base made one arm darker than the other. */
function drawCrossTrackFlat(lw, T){
  var ends = [
    [A.cx - A.arm, A.cy - A.arm, A.cx + A.arm, A.cy + A.arm],
    [A.cx + A.arm, A.cy - A.arm, A.cx - A.arm, A.cy + A.arm]
  ];
  var i, e, g, k;

  function crossLines(width, colour, alpha, blur){
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = colour;
    ctx.lineWidth = width;
    ctx.shadowColor = T.glow + "0.95)";
    ctx.shadowBlur = blur;
    for (i = 0; i < ends.length; i++) {
      e = ends[i];
      ctx.beginPath();
      ctx.moveTo(e[0], e[1]);
      ctx.lineTo(e[2], e[3]);
      ctx.stroke();
    }
  }

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  crossLines(lw + 12, T.col, 0.20, 30);
  crossLines(lw + 5, "#03050a", 0.60, 16);

  /* Smooth multi-colour blend on each arm without repainting the centre. */
  ctx.globalAlpha = 1;
  ctx.lineWidth = lw;
  ctx.shadowBlur = 0;
  for (i = 0; i < ends.length; i++) {
    e = ends[i];
    g = ctx.createLinearGradient(e[0], e[1], e[2], e[3]);
    for (k = 0; k < TRACK.length; k++) {
      g.addColorStop(k / (TRACK.length - 1), TRACK[k]);
    }
    ctx.strokeStyle = g;
    ctx.beginPath();
    ctx.moveTo(e[0], e[1]);
    ctx.lineTo(e[2], e[3]);
    ctx.stroke();
  }

  crossLines(1.1, "#ffffff", 0.18, 0);
  ctx.restore();
}

/* Give every polygon edge the complete blended palette instead of assigning
   one dominant colour to each side. Used by the triangle and square. */
function drawPolygonTrackFlat(lw, T, sides, rotation){
  var pts = [], i;
  for (i = 0; i < sides; i++) {
    pts.push({
      x: A.cx + Math.cos(rotation + i * Math.PI * 2 / sides) * A.pr,
      y: A.cy + Math.sin(rotation + i * Math.PI * 2 / sides) * A.pr
    });
  }
  drawBlendedClosedTrack(lw, T, pts);
}

function drawStarTrackFlat(lw, T){
  var pts = [], i, radius, angle;
  for (i = 0; i < 10; i++) {
    radius = (i % 2 === 0) ? A.so : A.si;
    angle = -Math.PI / 2 + i * Math.PI / 5;
    pts.push({ x:A.cx + Math.cos(angle) * radius, y:A.cy + Math.sin(angle) * radius });
  }
  drawBlendedClosedTrack(lw, T, pts);
}

function drawBlendedClosedTrack(lw, T, pts){
  var edges = [], i, e, g, k;
  for (i = 0; i < pts.length; i++) edges.push([pts[i], pts[(i + 1) % pts.length]]);

  function closedStroke(width, colour, alpha, blur){
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = colour;
    ctx.lineWidth = width;
    ctx.shadowColor = T.glow + "0.95)";
    ctx.shadowBlur = blur;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.stroke();
  }

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  closedStroke(lw + 12, T.col, 0.20, 30);
  closedStroke(lw + 5, "#03050a", 0.60, 16);

  ctx.globalAlpha = 1;
  ctx.lineWidth = lw;
  ctx.shadowBlur = 0;
  ctx.lineCap = "round";
  for (i = 0; i < edges.length; i++) {
    e = edges[i];
    g = ctx.createLinearGradient(e[0].x, e[0].y, e[1].x, e[1].y);
    for (k = 0; k < TRACK.length; k++) {
      g.addColorStop(k / (TRACK.length - 1), TRACK[k]);
    }
    ctx.strokeStyle = g;
    ctx.beginPath();
    ctx.moveTo(e[0].x, e[0].y);
    ctx.lineTo(e[1].x, e[1].y);
    ctx.stroke();
  }

  /* A subtle continuous rim reconnects and smooths all corners. */
  ctx.lineCap = "round";
  closedStroke(1.1, "#ffffff", 0.18, 0);
  ctx.restore();
}

/* flat style ka zone: thos rang + safed baahri outline + safed PERFECT patti */
function drawZoneFlat(cached){
  var T = tier(), lw = shp().lw;
  var a = S.zoneA, b = S.zoneA + S.zoneW;
  var half = S.zoneW / 2, mid = a + half, pb = half * CFG.perfectBand;
  var tight = S.zoneW <= CFG.minZone * 1.7;
  var pulse = cached ? 0.5 : 0.5 + 0.5 * Math.sin(TT * (tight ? 10.5 : 5.0));
  var col   = tight ? "#ff4d5e" : T.col;
  var glow  = tight ? "rgba(255,77,94," : T.glow;
  var gin   = cached ? 1 : 0.35 + 0.65 * Math.min(1, (S.zoneIn === undefined ? 1 : S.zoneIn) * 1.5);

  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  /* halka halo */
  ctx.globalAlpha = (0.16 + 0.14 * pulse) * gin;
  ctx.shadowColor = glow + "0.90)";
  ctx.shadowBlur = 26;
  ctx.strokeStyle = col;
  ctx.lineWidth = lw + 10;
  strokePath(a, b, 14);
  ctx.shadowBlur = 0;

  /* One continuous outer border follows sharp corners without crossing itself. */
  ctx.globalAlpha = gin;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = lw + 4.5;
  strokePath(a, b, 32);

  /* thos zone */
  ctx.strokeStyle = col;
  ctx.lineWidth = lw;
  strokePath(a, b, 32);

  /* PERFECT patti - colored gold so it doesn't look like a second needle */
  ctx.shadowColor = "rgba(255,209,102,0.85)";
  ctx.shadowBlur = 12 + 8 * pulse;
  ctx.strokeStyle = "#ffd166";
  ctx.lineWidth = lw;
  strokePath(mid - pb, mid + pb, 6);
  ctx.shadowBlur = 0;
  
  /* Inner bright stripe for perfect band */
  ctx.strokeStyle = "#fff0b3";
  ctx.lineWidth = lw * 0.4;
  strokePath(mid - pb * 0.6, mid + pb * 0.6, 6);

  ctx.restore();
}

function drawNeedleFlat(p, ang, col){
  var lw = shp().lw, ext = lw * 0.85;
  if (IS_MOBILE) {
    var key = lw + ':' + RENDER_SCALE;
    if (!NEEDLE_FRAME || NEEDLE_FRAME.key !== key) {
      var surface = document.createElement('canvas');
      var width = 70, height = ext * 2.5 + 70;
      surface.width = Math.ceil(width * RENDER_SCALE);
      surface.height = Math.ceil(height * RENDER_SCALE);
      var nc = surface.getContext('2d');
      nc.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, surface.width/2, surface.height/2);
      nc.fillStyle = '#ffffff'; nc.shadowColor = 'rgba(255,255,255,0.95)'; nc.shadowBlur = 15;
      nc.fillRect(-2.5, -ext * 1.25, 5, ext * 2.5);
      NEEDLE_FRAME = {key:key, image:surface};
    }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang); ctx.globalAlpha = 1;
    var nw = NEEDLE_FRAME.image.width / RENDER_SCALE, nh = NEEDLE_FRAME.image.height / RENDER_SCALE;
    ctx.drawImage(NEEDLE_FRAME.image, -nw/2, -nh/2, nw, nh);
    ctx.restore(); return;
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);

  /* Sharp white bar - no shadow for cleaner look */
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(255,255,255,0.95)";
  ctx.shadowBlur = 15;
  ctx.fillRect(-2.5, -ext * 1.25, 5, ext * 2.5);

  ctx.restore();
}

function dimHex(h, f){
  var r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return "rgb(" + ((r*f)|0) + "," + ((g*f)|0) + "," + ((b*f)|0) + ")";
}

function drawTrackNeon(lw){
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  
  /* Deep Blue/Cyan glowing outer aura */
  ctx.shadowColor = "#00f0ff";
  ctx.shadowBlur = 20;
  ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
  ctx.lineWidth = lw * 0.8;
  strokePath(0, 1, 80);
  
  /* Inner bright crisp track line */
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#e0ffff";
  ctx.lineWidth = 3.5;
  strokePath(0, 1, 90);
  
  ctx.restore();
}

/* STYLE 3 - "glass": shishe jaisa bar (pichla wala). */
function drawTrackGlass(lw){
  var segs = 110, i, a, b, p, q, k, ct;

  ctx.save();
  ctx.lineJoin = "round";

  /* 1. neeche gehra saya - track hawa mein tairta hua lagta hai */
  ctx.lineCap = "round";
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = "#000000";
  ctx.lineWidth = lw + 16;
  ctx.shadowColor = "rgba(0,0,0,0.9)";
  ctx.shadowBlur = 24;
  strokePath(0, 1, 80);
  ctx.shadowBlur = 0;

  /* 2. bahar ka rim - kinara saaf nazar aata hai */
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#0b0f1a";
  ctx.lineWidth = lw + 7;
  strokePath(0, 1, 80);

  /* 3. base gradient - 110 segments + butt caps = bilkul smooth, koi seam nahi
        (pehle 48 round-cap segments overlap kar ke dhabbe banate thay) */
  ctx.lineCap = "butt";
  ctx.lineWidth = lw;
  for (i = 0; i < segs; i++) {
    a = i / segs;
    b = (i + 1.15) / segs; if (b > 1) b = 1;
    p = pathAt(a); q = pathAt(b);
    ctx.strokeStyle = trackCol(a);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  /* butt caps ki wajah se sire kate hue thay - dobara gol karo */
  ctx.lineCap = "round";
  ctx.strokeStyle = trackCol(0);     strokePath(0, 0.010, 2);
  ctx.strokeStyle = trackCol(0.999); strokePath(0.990, 1, 2);

  /* 4. shishe wali gehrai: upar safed highlight, neeche kaala shade */
  ctx.globalAlpha = 0.13;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = lw * 0.19;
  strokePathOffset(0, 1, 80, -lw * 0.31);

  ctx.globalAlpha = 0.32;
  ctx.strokeStyle = "#000000";
  ctx.lineWidth = lw * 0.26;
  strokePathOffset(0, 1, 80, lw * 0.30);
  ctx.globalAlpha = 1;

  /* 5. ticks - marker kahan hai, ab aankh se parha ja sakta hai */
  for (k = 1; k < 20; k++) {
    crossTick(k / 20, lw * ((k % 5 === 0) ? 0.78 : 0.50), 1.6, "#ffffff",
              (k % 5 === 0) ? 0.15 : 0.07);
  }

  /* 6. behti hui chevrons - direction saaf */
  for (k = 0; k < 3; k++) {
    ct = (TT * 0.22 + k / 3) % 1;
    chevron(ct, "#ffffff", 0.11, 1);
  }

  ctx.restore();
}

function drawZone(){
  if (CFG.barStyle === "flat" || CFG.barStyle === "pro") { drawCachedZone(); return; }
  var T = tier(), lw = shp().lw;
  var a = S.zoneA, b = S.zoneA + S.zoneW;
  var half = S.zoneW / 2, mid = a + half, pb = half * CFG.perfectBand;
  
  if (CFG.barStyle === "neon") {
    ctx.save();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    var pinkCol = "#ff007f";
    ctx.shadowColor = pinkCol; ctx.shadowBlur = 25;
    ctx.strokeStyle = pinkCol; ctx.lineWidth = lw * 1.1;
    strokePath(a, b, 18);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#ff66b2"; ctx.lineWidth = lw * 0.4;
    strokePath(a, b, 18);
    ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 10;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = lw * 0.4;
    strokePath(mid - pb * 0.6, mid + pb * 0.6, 6);
    ctx.restore();
    return;
  }
  
  var tight = S.zoneW <= CFG.minZone * 1.7;
  var pulse = 0.5 + 0.5 * Math.sin(TT * (tight ? 10.5 : 5.0));
  var col   = tight ? "#ff4d5e" : T.col;
  var glow  = tight ? "rgba(255,77,94," : T.glow;

  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  /* bahar ka neon halo */
  ctx.globalAlpha = 0.40 + 0.16 * pulse;
  ctx.shadowColor = glow + "0.95)";
  ctx.shadowBlur = 30;
  ctx.strokeStyle = col;
  ctx.lineWidth = lw + 16;
  strokePath(a, b, 16);
  ctx.shadowBlur = 0;

  /* safed border outline */
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = lw + 4;
  strokePath(a, b, 18);

  /* zone ka body */
  ctx.strokeStyle = col;
  ctx.lineWidth = lw;
  strokePath(a, b, 18);

  /* PERFECT patti - solid white center */
  ctx.lineCap = "butt";
  ctx.strokeStyle = "#f3f6fa";
  ctx.lineWidth = lw;
  strokePath(mid - pb, mid + pb, 6);
  ctx.lineCap = "round";

  ctx.restore();
}

/* marker ke peeche ghost trail */
function drawTrail(col){
  var i, p, n = trail.length;
  if (n < 2) return;
  
  // No trail for the flat bar for a super clean aesthetic
  if (CFG.barStyle === "flat" && objId === "bar") return;

  ctx.save();
  for (i = 0; i < n; i++) {
    p = trail[i];
    var alpha = (i / n) * (i / n);
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.4 + (i / n) * 5.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* needle - stop point ka exact pixel, isi se precision parhi jati hai */
function drawNeedle(p, ang, col){
  if (objId !== "bar") { drawObj(objId, p.x, p.y, ang, col, 1.15); return; }
  
  if (CFG.barStyle === "flat" || CFG.barStyle === "pro") { drawNeedleFlat(p, ang, col); return; }
  var lw = shp().lw;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);
  
  /* 1. Base Dark Halo / Housing */
  ctx.globalAlpha = 0.65;
  ctx.fillStyle = "#05060a";
  ctx.shadowColor = "rgba(0,0,0,0.8)";
  ctx.shadowBlur = 10;
  rr(-3.8, -lw * 0.75, 7.6, lw * 1.50, 3.8);
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 2. Outer Rim Light (Glassy reflection) */
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 3. Colored Core with Glow */
  ctx.globalAlpha = 1;
  ctx.fillStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 18;
  rr(-1.5, -lw * 0.68, 3.0, lw * 1.36, 1.5);
  ctx.fill();
  ctx.shadowBlur = 0;

  /* 4. Bright White Center Dot for Precision */
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#ffffff";
  ctx.shadowBlur = 8;
  rr(-0.5, -lw * 0.30, 1.0, lw * 0.60, 0.5);
  ctx.fill();

  ctx.restore();
}

/* is run mein kahan kahan ruke - hara = laga, surkh = chooka */
function drawStops(){
  var i, s, p;
  for (i = 0; i < stops.length; i++) {
    s = stops[i];
    if (s.life <= 0) continue;
    p = pathAt(s.t);
    ctx.save();
    ctx.globalAlpha = Math.min(0.6, s.life * 0.45);
    ctx.fillStyle = s.ok ? "#22d3a6" : "#ff4d5e";
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}


/* ----------------------------------------------------------
   11. THE CHARACTERS - shop se badalte hain
   ---------------------------------------------------------- */
function moodNow(){
  if (S.phase === "over") return 3;   /* mar gaya */
  if (S.happyT > 0)       return 1;   /* khush */
  if (S.level >= 8)       return 2;   /* dara hua */
  return 0;                            /* normal */
}

function drawFace(cx, cy, s, mood){
  var ex = s * 0.19, ey = cy - s * 0.05, er = s * 0.105;
  var i, sx, blinking = (S.blink > 0);

  ctx.save();
  ctx.lineCap = "round";

  if (mood === 3) {
    ctx.strokeStyle = "#05060a"; ctx.lineWidth = s * 0.05;
    for (i = -1; i <= 1; i += 2) {
      sx = cx + i * ex;
      ctx.beginPath();
      ctx.moveTo(sx - er, ey - er); ctx.lineTo(sx + er, ey + er);
      ctx.moveTo(sx + er, ey - er); ctx.lineTo(sx - er, ey + er);
      ctx.stroke();
    }
  } else if (blinking) {
    ctx.strokeStyle = "#05060a"; ctx.lineWidth = s * 0.045;
    for (i = -1; i <= 1; i += 2) {
      sx = cx + i * ex;
      ctx.beginPath(); ctx.moveTo(sx - er, ey); ctx.lineTo(sx + er, ey); ctx.stroke();
    }
  } else {
    for (i = -1; i <= 1; i += 2) {
      sx = cx + i * ex;
      ctx.beginPath(); ctx.arc(sx, ey, er, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.beginPath();
      ctx.arc(sx + (mood === 2 ? -er * 0.25 : 0), ey + er * 0.12, er * 0.48, 0, Math.PI * 2);
      ctx.fillStyle = "#05060a"; ctx.fill();
    }
  }

  ctx.strokeStyle = "#05060a";
  ctx.lineWidth = s * 0.045;
  ctx.beginPath();
  if (mood === 1)      ctx.arc(cx, cy + s * 0.10, s * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
  else if (mood === 2) ctx.arc(cx, cy + s * 0.22, s * 0.15, 1.15 * Math.PI, 1.85 * Math.PI);
  else if (mood === 3) ctx.arc(cx, cy + s * 0.24, s * 0.14, 1.15 * Math.PI, 1.85 * Math.PI);
  else                 ctx.arc(cx, cy + s * 0.12, s * 0.13, 0.20 * Math.PI, 0.80 * Math.PI);
  ctx.stroke();

  if (mood === 1) {
    ctx.fillStyle = "rgba(255,120,150,0.45)";
    for (i = -1; i <= 1; i += 2) {
      ctx.beginPath(); ctx.arc(cx + i * s * 0.30, cy + s * 0.06, s * 0.075, 0, Math.PI * 2); ctx.fill();
    }
  }

  if (mood === 2) {
    ctx.strokeStyle = "#05060a"; ctx.lineWidth = s * 0.038;
    ctx.beginPath();
    ctx.moveTo(cx - ex - er, ey - er * 1.5); ctx.lineTo(cx - ex + er, ey - er * 2.3);
    ctx.moveTo(cx + ex + er, ey - er * 1.5); ctx.lineTo(cx + ex - er, ey - er * 2.3);
    ctx.stroke();
    ctx.fillStyle = "#7dd3fc";
    ctx.beginPath();
    ctx.arc(cx + s * 0.34, cy - s * 0.12 + Math.sin(TT * 3) * s * 0.02, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawBody(id, cx, cy, s, col){
  var i, a, r, x1, x2;
  ctx.fillStyle = col;

  if (id === "pill") {
    rr(cx - s*0.32, cy - s*0.48, s*0.64, s*0.96, s*0.32); ctx.fill();

  } else if (id === "star") {
    ctx.beginPath();
    for (i = 0; i < 10; i++) {
      a = -Math.PI/2 + i * Math.PI / 5;
      r = (i % 2 === 0) ? s*0.56 : s*0.25;
      if (i === 0) ctx.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
      else         ctx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();

  } else if (id === "ghost") {
    ctx.beginPath();
    ctx.arc(cx, cy - s*0.06, s*0.44, Math.PI, 0);
    ctx.lineTo(cx + s*0.44, cy + s*0.30);
    for (i = 0; i < 4; i++) {
      x1 = cx + s*0.44 - s*0.11 - s*0.22*i;
      x2 = cx + s*0.44 - s*0.22*(i + 1);
      ctx.quadraticCurveTo(x1, cy + s*0.30 + ((i % 2) ? -s*0.11 : s*0.11), x2, cy + s*0.30);
    }
    ctx.closePath(); ctx.fill();

  } else if (id === "bot") {
    ctx.strokeStyle = col; ctx.lineWidth = s*0.05; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - s*0.42); ctx.lineTo(cx, cy - s*0.60); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy - s*0.64, s*0.06, 0, Math.PI*2); ctx.fill();
    rr(cx - s*0.42, cy - s*0.42, s*0.84, s*0.84, s*0.16); ctx.fill();

  } else if (id === "flame") {
    ctx.beginPath();
    ctx.moveTo(cx, cy - s*0.56);
    ctx.bezierCurveTo(cx + s*0.46, cy - s*0.14, cx + s*0.40, cy + s*0.50, cx, cy + s*0.50);
    ctx.bezierCurveTo(cx - s*0.40, cy + s*0.50, cx - s*0.46, cy - s*0.14, cx, cy - s*0.56);
    ctx.closePath(); ctx.fill();

  } else {
    /* blob - default */
    rr(cx - s*0.44, cy - s*0.44, s*0.88, s*0.88, s*0.30); ctx.fill();
  }
}

function drawChar(id, cx, cy, s, col, mood){
  var T = tier();
  
  // Use a much slower time multiplier, and ease it so it breathes smoothly step by step
  // Math.sin(TT * 2.0) is a slow 3-second cycle
  // Using Math.sin(...)*Math.sin(...) can create a "pulse then rest" effect, but simple slow sin is usually best
  var tBob = TT * 2.2;
  var bob = Math.sin(tBob) * s * 0.04;
  
  // Stretch with a slight phase shift for organic feel
  var stretchX = 1 + Math.cos(tBob) * 0.03;
  var stretchY = 1 - Math.cos(tBob) * 0.03;
  
  // Very slow, gentle tilt
  var tilt = Math.sin(TT * 1.1) * 0.03;

  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.rotate(tilt);
  ctx.scale(stretchX, stretchY);
  
  if (IS_MOBILE) {
    drawEffectSprite('body:' + id + ':' + s + ':' + col + ':' + T.glow,
      0, 0, s * 3, s * 3, function(){
        ctx.shadowColor = T.glow + "0.55)";
        ctx.shadowBlur = s * 0.55;
        drawBody(id, 0, 0, s, col);
      });
  } else {
    ctx.shadowColor = T.glow + "0.55)";
    ctx.shadowBlur = s * 0.55;
    drawBody(id, 0, 0, s, col);
  }
  
  ctx.shadowBlur = 0; 
  drawFace(0, 0, s, mood);
  
  ctx.restore();
}


/* ----------------------------------------------------------
   12. THE MOVING OBJECTS - shop se badalte hain
   ---------------------------------------------------------- */
function drawObj(id, x, y, ang, col, sc){
  sc = sc || 1;
  var i;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.shadowColor = col;
  ctx.shadowBlur = 18 * sc;
  ctx.fillStyle = col;

  if (id === "orb") {
    ctx.beginPath(); ctx.arc(0, 0, 12*sc, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(-3.5*sc, -3.5*sc, 4*sc, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fill();

  } else if (id === "arrow") {
    ctx.beginPath();
    ctx.moveTo(16*sc, 0);
    ctx.lineTo(-10*sc, -13*sc);
    ctx.lineTo(-4*sc, 0);
    ctx.lineTo(-10*sc, 13*sc);
    ctx.closePath(); ctx.fill();

  } else if (id === "diamond") {
    ctx.rotate(TT * 3);
    ctx.beginPath();
    ctx.moveTo(0, -15*sc); ctx.lineTo(11*sc, 0);
    ctx.lineTo(0,  15*sc); ctx.lineTo(-11*sc, 0);
    ctx.closePath(); ctx.fill();

  } else if (id === "blade") {
    rr(-20*sc, -4*sc, 40*sc, 8*sc, 4*sc); ctx.fill();
    ctx.globalAlpha = 0.35;
    rr(-36*sc, -2*sc, 22*sc, 4*sc, 2*sc); ctx.fill();
    ctx.globalAlpha = 1;

  } else if (id === "comet") {
    for (i = 3; i >= 1; i--) {
      ctx.globalAlpha = 0.15 * i;
      ctx.beginPath(); ctx.arc(-i*11*sc, 0, (11 - i*2.2)*sc, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(0, 0, 11*sc, 0, Math.PI*2); ctx.fill();

function drawHeart(x, y, s, filled, crisp){

/* Full-density artwork is reused while position and scale animate on screen.
   Bounded storage prevents texture growth during long sessions. */
function drawEffectSprite(key, x, y, width, height, paint){
  key += ':' + RENDER_SCALE;
  var surface = EFFECT_FRAMES.get(key);
  if (!surface) {
    // Stateful panels only need their newest version, not every previous score.
    var family = key.split(':')[0];
    if (family === 'header' || family === 'powers' || family === 'score' || family === 'body') {
      EFFECT_FRAMES.forEach(function(value, oldKey){
        if (oldKey.indexOf(family + ':') === 0) EFFECT_FRAMES.delete(oldKey);
      });
    }
    surface = document.createElement('canvas');
    surface.width = Math.ceil(width * RENDER_SCALE);
    surface.height = Math.ceil(height * RENDER_SCALE);
    var screen = ctx;
    ctx = surface.getContext('2d');
    ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, surface.width / 2, surface.height / 2);
    try { paint(); } finally { ctx = screen; }
    if (EFFECT_FRAMES.size >= 32) EFFECT_FRAMES.delete(EFFECT_FRAMES.keys().next().value);
    EFFECT_FRAMES.set(key, surface);
  }
  var w = surface.width / RENDER_SCALE, h = surface.height / RENDER_SCALE;
  ctx.drawImage(surface, x - w / 2, y - h / 2, w, h);
}

function drawCoin(x, y, r, uncached){

    drawEffectSprite('coin:' + r, x, y, r * 2 + 40, r * 2 + 40,

    return;
  }
  var cg = ctx.createRadialGradient(x - r*0.35, y - r*0.4, r*0.1, x, y, r);
  cg.addColorStop(0, "#fff8bd");
  cg.addColorStop(0.32, "#ffd95e");
  cg.addColorStop(0.72, "#f2a91f");
  cg.addColorStop(1, "#9f5b08");

  ctx.shadowColor = "rgba(255,196,48,0.75)"; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = cg; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,244,170,0.85)"; ctx.lineWidth = Math.max(1, r*0.13); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r*0.56, 0, Math.PI*2);
  ctx.strokeStyle = "rgba(126,70,6,0.65)"; ctx.lineWidth = Math.max(1, r*0.14); ctx.stroke();

  ctx.lineTo(x - r*0.18, y + r*0.28);
  ctx.strokeStyle = "rgba(255,247,190,0.78)"; ctx.lineWidth = Math.max(1, r*0.12); ctx.stroke();

function stepFx(dt){
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) {
    p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += 620 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.985;
  }
  for (i = stops.length - 1; i >= 0; i--) {
    stops[i].life -= dt;
    if (stops[i].life <= 0) stops.splice(i, 1);
  }
  for (i = pops.length - 1; i >= 0; i--) {
    pops[i].life -= dt * 1.25;
    pops[i].y -= 42 * dt;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }

  if (S.zoneIn === undefined) { S.zoneIn = 1; S.wash = 0; S.potPunch = 0; S.washCol = "#ffffff"; }
  if (S.zoneIn < 1)   { S.zoneIn   += dt * 4.2; if (S.zoneIn > 1)   S.zoneIn   = 1; }
  if (S.wash > 0)     { S.wash     -= dt * 1.9; if (S.wash < 0)     S.wash     = 0; }
  if (S.potPunch > 0) { S.potPunch -= dt * 3.0; if (S.potPunch < 0) S.potPunch = 0; }

  for (i = shocks.length - 1; i >= 0; i--) {
    p = shocks[i];
    p.life -= dt * 2.1;
    p.r += (p.max - p.r) * Math.min(1, dt * 7);
    if (p.life <= 0) shocks.splice(i, 1);
  }

  for (i = coinsFly.length - 1; i >= 0; i--) {
    p = coinsFly[i];
    if (p.d > 0) { p.d -= dt; continue; }
    p.t += dt * 1.6;
    if (p.t >= 1) {
      S.potPunch = 1;
      if (Math.random() < 0.5) sfxTick();
      coinsFly.splice(i, 1);
      continue;
    }
    var e = p.t * p.t * (3 - 2 * p.t);
    p.cx = p.sx + (p.tx - p.sx) * e;
    p.cy = p.sy + (p.ty - p.sy) * e - Math.sin(p.t * Math.PI) * 85;
  }

  if (!dust.length) initDust();
  for (i = 0; i < dust.length; i++) {
    dust[i].y -= dust[i].v * dt;
    if (dust[i].y < -4) { dust[i].y = H + 4; dust[i].x = Math.random() * W; }
  }
}

function drawFx(){
  var i, p;
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* shockwave rings - har hit aur miss par phailti hui goli */
  for (i = 0; i < shocks.length; i++) {
    p = shocks[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life * 0.5);
    ctx.strokeStyle = p.col;
    ctx.lineWidth = 1.5 + 4 * Math.max(0, p.life);
    ctx.shadowColor = p.col; ctx.shadowBlur = IS_MOBILE ? 5 : 12;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* urrte sikke */
  for (i = 0; i < coinsFly.length; i++) {
    p = coinsFly[i];
    if (p.d > 0) continue;
    drawCoin(p.cx, p.cy, 6);
  }

  for (i = 0; i < pops.length; i++) {
    p = pops[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    text(p.t, p.x, p.y, p.size, p.col);
  }
  ctx.globalAlpha = 1;

  /* poori screen par halka rang - milestone, new shape, miss, new best */
  if (S.wash > 0) {
    ctx.globalAlpha = S.wash * 0.16;
    ctx.fillStyle = S.washCol || "#ffffff";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

/* narm roshni ka gola - background ke liye */
function blob(x, y, r, col){
  var rg = ctx.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, col);
  rg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = rg;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

/* The track is static between shape/tier/layout changes. Cache its original
   high-density pixels; the target and moving marker still render every frame. */
function drawCachedZone(){
  /* Drifting targets change geometry every frame and use the live renderer. */
  if (!IS_MOBILE || S.drift) { drawZoneFlat(); return; }
  var key = shp().id + ':' + shp().lw + ':' + S.zoneA + ':' + S.zoneW + ':' + tier().col + ':' + CFG.perfectBand + ':' + JSON.stringify(A) + ':' + RENDER_SCALE;
  if (!ZONE_FRAME || ZONE_FRAME.key !== key) {
    var surface = document.createElement('canvas');
    surface.width = Math.ceil(W * RENDER_SCALE);
    surface.height = Math.ceil(340 * RENDER_SCALE);
    var screenCtx = ctx;
    ctx = surface.getContext('2d');
    ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, -300 * RENDER_SCALE);
    try { drawZoneFlat(true); } finally { ctx = screenCtx; }
    ZONE_FRAME = {key:key, image:surface};
  }
  var tight = S.zoneW <= CFG.minZone * 1.7;
  var pulse = 0.5 + 0.5 * Math.sin(TT * (tight ? 10.5 : 5));
  var gin = 0.35 + 0.65 * Math.min(1, (S.zoneIn === undefined ? 1 : S.zoneIn) * 1.5);
  ctx.save(); ctx.globalAlpha *= gin * (0.95 + 0.05 * pulse);
  ctx.drawImage(ZONE_FRAME.image, 0, 300, ZONE_FRAME.image.width / RENDER_SCALE, ZONE_FRAME.image.height / RENDER_SCALE);
  ctx.restore();
}

function drawCachedTrack(lw){
  var key = shp().id + ':' + lw + ':' + tier().col + ':' + JSON.stringify(A) + ':' + RENDER_SCALE;
  if (!TRACK_FRAME || TRACK_FRAME.key !== key) {
    var surface = document.createElement('canvas');
    surface.width = Math.ceil(W * RENDER_SCALE);
    surface.height = Math.ceil(340 * RENDER_SCALE);
    var screenCtx = ctx;
    ctx = surface.getContext('2d');
    ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, -300 * RENDER_SCALE);
    try { drawTrackFlat(lw); } finally { ctx = screenCtx; }
    TRACK_FRAME = { key:key, image:surface };
  }
  ctx.drawImage(TRACK_FRAME.image, 0, 300, TRACK_FRAME.image.width / RENDER_SCALE, TRACK_FRAME.image.height / RENDER_SCALE);
}

var MOBILE_BG_CACHE = {};
var BODY_BG_SRC = "";
function updateBodyBackground(src){
  if (!src || BODY_BG_SRC === src) return;
  BODY_BG_SRC = src;
  var shell = document.getElementById("shellBg");
  if (shell) {
    shell.style.backgroundImage = "url('" + src + "')";
    shell.style.filter = src.indexOf("pulse-chamber") >= 0 ? "brightness(0.95)" : "brightness(0.68) saturate(1.08)";
  }
}
function mobileBgFrame(bgo, img){
  if (!IS_MOBILE || !img || !img.complete || !img.naturalWidth) return null;
  if (MOBILE_BG_CACHE[bgo.id]) return MOBILE_BG_CACHE[bgo.id];
  var out = document.createElement("canvas"), bx, by, bw, bh, bs, bgc, grade;
  out.width = W; out.height = H;
  bgc = out.getContext("2d", { alpha:false });
  bs = Math.max(W / img.naturalWidth, H / img.naturalHeight) * 1.04;
  bw = img.naturalWidth * bs; bh = img.naturalHeight * bs;
  bx = (W - bw) / 2; by = (H - bh) / 2;
  bgc.drawImage(img, bx, by, bw, bh);
  grade = bgc.createLinearGradient(0, 0, 0, H);
  grade.addColorStop(0, "rgba(3,7,16,0.58)");
  grade.addColorStop(0.46, "rgba(5,8,14,0.38)");
  grade.addColorStop(1, "rgba(2,3,8,0.72)");
  bgc.fillStyle = grade; bgc.fillRect(0, 0, W, H);
  MOBILE_BG_CACHE[bgo.id] = out;
  return out;
}

function drawBg(){
  var T = tier(), x, y, k, t = TT, off, g, fg, vg;
  var bgo = curBg();
  updateBodyBackground(bgo.src);
  if (IS_MOBILE) {
    /* One continuous DOM background prevents joins around the proportional canvas. */
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.restore();
    return;
  }
  var img = getImg(bgo.src);
  var fastBg = mobileBgFrame(bgo, img);
  if (fastBg) {
    ctx.drawImage(fastBg, 0, 0);
    return;
  }
  if (img && img.complete) {
    /* Slow cinematic drift adds depth without affecting gameplay. */
    var zoom = 1.04 + Math.sin(TT * 0.10) * 0.008;
    var scale = Math.max(W / img.width, H / img.height) * zoom;
    var dw = img.width * scale;
    var dh = img.height * scale;
    var dx = (W - dw) / 2 + Math.sin(TT * 0.075) * 6;
    var dy = (H - dh) / 2 + Math.cos(TT * 0.060) * 4;
    ctx.save();
    try { ctx.filter = "saturate(1.14) contrast(1.07)"; } catch(e){}
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();

    /* Layered color grade keeps art visible while preserving HUD contrast. */
    g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(3,7,16,0.58)");
    g.addColorStop(0.42, "rgba(5,8,14,0.38)");
    g.addColorStop(0.72, "rgba(5,6,12,0.46)");
    g.addColorStop(1, "rgba(2,3,8,0.72)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  } else {
    /* fallback to gradient if image not loaded or not found */
    g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    "#0c1226");
    g.addColorStop(0.42, "#06080f");
    g.addColorStop(0.78, "#080610");
    g.addColorStop(1,    "#12081c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* Subtle floating light motes make static art feel alive. */
  ctx.save();
  for (k = 0; k < 16; k++) {
    x = (k * 83 + TT * (4 + k % 3) * 3) % (W + 30) - 15;
    y = (k * 137 + Math.sin(TT * 0.22 + k) * 22 + H) % H;
    ctx.globalAlpha = 0.05 + (k % 4) * 0.018;
    ctx.fillStyle = (k % 3 === 0) ? T.col : "#b9d8ff";
    ctx.beginPath(); ctx.arc(x, y, 0.8 + (k % 3) * 0.55, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  /* Animated neon fog gives the lower scene a layered, cinematic depth. */
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  g = ctx.createLinearGradient(0, H * 0.50, 0, H);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.58, T.glow + "0.035)");
  g.addColorStop(0.82, T.glow + "0.085)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.50, W, H * 0.50);

  /* Slowly moving diagonal light streaks behind the gameplay. */
  ctx.lineCap = "round";
  for (k = 0; k < 5; k++) {
    off = ((TT * (7 + k) + k * 117) % (W + 180)) - 90;
    ctx.globalAlpha = 0.025 + k * 0.008;
    ctx.strokeStyle = k % 2 ? T.col : "#7dd3fc";
    ctx.lineWidth = 1 + (k % 2);
    ctx.beginPath();
    ctx.moveTo(off - 55, H * 0.72);
    ctx.lineTo(off + 65, H * 0.58);
    ctx.stroke();
  }
  ctx.restore();

  /* Soft horizon beam anchors the arena to the scene. */
  g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.20, T.glow + "0.03)");
  g.addColorStop(0.50, T.glow + "0.15)");
  g.addColorStop(0.80, T.glow + "0.03)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.735, W, 2);

  /* Very fine display texture prevents large dark areas looking flat. */
  ctx.save();
  ctx.globalAlpha = 0.022;
  ctx.fillStyle = "#b9d8ff";
  for (y = 1; y < H; y += 6) ctx.fillRect(0, y, W, 1);
  ctx.restore();

  /* Tier-colored atmosphere around the arena. */
  blob(225 + Math.sin(TT * 0.11) * 150, 235 + Math.cos(TT * 0.09) * 80, 250, T.glow + "0.13)");
  
  blob(A.cx, A.cy, 265, T.glow + (0.10 + Math.min(0.13, S.level * 0.005)).toFixed(3) + ")");
  fg = ctx.createLinearGradient(0, A.cy + 105, 0, A.cy + 195);
  fg.addColorStop(0, T.glow + "0.10)");
  fg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = fg;
  ctx.fillRect(0, A.cy + 105, W, 90);

  vg = ctx.createRadialGradient(225, 380, 200, 225, 380, 500);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.60)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawPowerIcon(id, cx, cy, size, col){
  var s = size, i, a, power = null, icon = null;
  for (i = 0; i < POWERS.length; i++) if (POWERS[i].id === id) { power = POWERS[i]; break; }
  if (power) icon = getImg(power.src);
  ctx.save();
  ctx.translate(cx, cy);
  if (icon && icon.complete && icon.naturalWidth > 0) {
    var iconKey = id + ':' + size + ':' + col + ':' + RENDER_SCALE;
    var iconFrame = POWER_ICON_FRAMES[iconKey];
    if (!iconFrame) {
      iconFrame = document.createElement('canvas');
      iconFrame.width = iconFrame.height = Math.ceil(s * 2.8 * RENDER_SCALE);
      var iconCtx = iconFrame.getContext('2d');
      iconCtx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, iconFrame.width/2, iconFrame.height/2);
      iconCtx.imageSmoothingQuality = 'high';
      iconCtx.shadowColor = col; iconCtx.shadowBlur = s * 0.30;
      iconCtx.drawImage(icon, -s * 0.62, -s * 0.62, s * 1.24, s * 1.24);
      POWER_ICON_FRAMES[iconKey] = iconFrame;
    }
    var iconWidth = iconFrame.width / RENDER_SCALE;
    ctx.drawImage(iconFrame, -iconWidth/2, -iconWidth/2, iconWidth, iconWidth);
    ctx.restore();
    return;
  }
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = Math.max(2, s * 0.10);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowColor = col;
  ctx.shadowBlur = s * 0.35;

  if (id === "slow") {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.46, 0, Math.PI * 2); ctx.stroke();
    for (i = 0; i < 4; i++) {
      a = i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * s * 0.34, Math.sin(a) * s * 0.34);
      ctx.lineTo(Math.cos(a) * s * 0.42, Math.sin(a) * s * 0.42);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s * 0.25); ctx.moveTo(0, 0); ctx.lineTo(s * 0.22, s * 0.12); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.07, 0, Math.PI * 2); ctx.fill();
  } else if (id === "shield") {
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.48); ctx.lineTo(s * 0.38, -s * 0.30);
    ctx.lineTo(s * 0.31, s * 0.18); ctx.quadraticCurveTo(s * 0.22, s * 0.38, 0, s * 0.50);
    ctx.quadraticCurveTo(-s * 0.22, s * 0.38, -s * 0.31, s * 0.18);
    ctx.lineTo(-s * 0.38, -s * 0.30); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.18, 0); ctx.lineTo(-s * 0.04, s * 0.15); ctx.lineTo(s * 0.22, -s * 0.16); ctx.stroke();
  } else if (id === "revive") {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.42);
    ctx.bezierCurveTo(-s * 0.50, s * 0.12, -s * 0.45, -s * 0.38, -s * 0.18, -s * 0.40);
    ctx.bezierCurveTo(-s * 0.04, -s * 0.41, 0, -s * 0.28, 0, -s * 0.20);
    ctx.bezierCurveTo(0, -s * 0.28, s * 0.04, -s * 0.41, s * 0.18, -s * 0.40);
    ctx.bezierCurveTo(s * 0.45, -s * 0.38, s * 0.50, s * 0.12, 0, s * 0.42);
    ctx.stroke();
    ctx.lineWidth = Math.max(2.2, s * 0.12);
    ctx.beginPath(); ctx.moveTo(0, -s * 0.16); ctx.lineTo(0, s * 0.16); ctx.moveTo(-s * 0.16, 0); ctx.lineTo(s * 0.16, 0); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-s * 0.14, s * 0.10, s * 0.30, 0, Math.PI * 2); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(s * 0.14, -s * 0.27); ctx.lineTo(s * 0.14, s * 0.07); ctx.stroke();

  }

}

function drawPowerButtons(uncached){
  if (IS_MOBILE && !uncached) {
    var ready = POWERS.every(function(p){ var img = getImg(p.src); return img.complete && img.naturalWidth > 0; });
    var first = powerButtonBox(POWER_BTNS[0]), lastPowerBox = powerButtonBox(POWER_BTNS[POWER_BTNS.length - 1]);
    var railX = HUD_LEFT, railW = HUD_COIN_W;
    var left = railX - 12, top = first.y - 18;
    var width = railW + 24, height = lastPowerBox.y + lastPowerBox.h - top + 18;
    var key = 'powers:' + JSON.stringify(POWER_STOCK) + ':' + [S.slowHits,S.doubleHits,S.shieldActive,S.reviveActive,ready,left,top,width,height].join(':');
    drawEffectSprite(key, left + width/2, top + height/2, width, height, function(){
      ctx.translate(-left - width/2, -top - height/2);
      drawPowerButtons(true);
    });
    return;
  }
  var i, b, power, active, activeText, bg;
  var firstPower = powerButtonBox(POWER_BTNS[0]);
  var lastPower = powerButtonBox(POWER_BTNS[POWER_BTNS.length - 1]);
  var railX = HUD_LEFT, railW = HUD_COIN_W;
  var railTop = firstPower.y - 6;
  var railH = (lastPower.y + lastPower.h) - railTop + 6;

  /* Sleek glass background rail enclosing all power buttons in a column */
  ctx.save();
  rr(railX, railTop, railW, railH, 10);
  ctx.fillStyle = "rgba(5,8,17,0.60)"; ctx.fill();
  ctx.strokeStyle = "rgba(117,137,170,0.20)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  for (i = 0; i < POWER_BTNS.length; i++) {
    b = powerButtonBox(POWER_BTNS[i]);
    power = POWERS.filter(function(p){ return p.id === b.id; })[0];
    active = (b.id === "slow" && S.slowHits > 0) ||
             (b.id === "double" && S.doubleHits > 0) ||
             (b.id === "shield" && S.shieldActive) ||
             (b.id === "revive" && S.reviveActive);
    activeText = b.id === "slow" ? S.slowHits : (b.id === "double" ? S.doubleHits : (active ? 1 : 0));

    ctx.save();
    rr(b.x, b.y, b.w, b.h, 10);
    bg = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    bg.addColorStop(0, active ? "#182a38" : "#121a29");
    bg.addColorStop(1, "#050811");
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = active ? power.col : (POWER_STOCK[b.id] > 0 ? power.col : "#303a4c");
    ctx.globalAlpha = active ? 1 : (POWER_STOCK[b.id] > 0 ? 0.72 : 0.48);
    ctx.lineWidth = active ? 2.5 : 1.5;
    if (active || POWER_STOCK[b.id] > 0) { ctx.shadowColor = power.col; ctx.shadowBlur = active ? 16 : 7; }
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.globalAlpha = POWER_STOCK[b.id] > 0 || active ? 1 : 0.55;
    drawPowerIcon(b.id, b.x + b.w/2, b.y + b.h * 0.36, IS_MOBILE ? 27 : 29, power.col);

    /* High-contrast quantity/active badge */
    ctx.globalAlpha = 1;
    rr(b.x + 6, b.y + b.h - 17, b.w - 12, 13, 6);
    ctx.fillStyle = active ? power.col : "#202a3b"; ctx.fill();
    text(active ? ("ON " + activeText) : ("x" + POWER_STOCK[b.id]),
         b.x + b.w/2, b.y + b.h - 10.5, 9, active ? "#05060a" : "#ffffff", "center", 0);
    ctx.restore();
  }
}

/* kisi bhi shape ka chhota preview - path sample kar ke tile mein fit karta hai */
function drawMiniShape(idx, cx, cy, size, col, alpha){
  var keep = S.shape, n = 96, i, p, pts = [];
  var mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9, sc, X, Y;
  S.shape = idx;
  for (i = 0; i <= n; i++) {
    p = pathAt(i / n);
    pts.push({ x:p.x, y:p.y });
    if (p.x < mnx) mnx = p.x;
    if (p.x > mxx) mxx = p.x;
    if (p.y < mny) mny = p.y;
    if (p.y > mxy) mxy = p.y;
  }
  S.shape = keep;

  sc = size / Math.max(1, Math.max(mxx - mnx, mxy - mny));
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = 3.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowColor = "rgba(255,255,255,0.22)";
  ctx.shadowBlur = 6;
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) {
    X = cx + (pts[i].x - (mnx + mxx) / 2) * sc;
    Y = cy + (pts[i].y - (mny + mxy) / 2) * sc;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.stroke();
  ctx.restore();
}

    return { x: inset + col * (mobileW + gap), y: 122 + row * 104, w: mobileW, h: 96 };
  }
  return { x: 30 + col * 204, y: 122 + row * 104, w: 186, h: 96 };
}
