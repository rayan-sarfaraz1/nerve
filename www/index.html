    ctx.stroke();

    mCol = unlocked ? (cur ? T.col : "#8ea3c0") : "#2a3348";
    drawMiniShape(i, b.x + 46, b.y + b.h / 2, 52, mCol, unlocked ? 1 : 0.5);

    text(sh.name, b.x + 84, b.y + 34, 13, unlocked ? "#e9edf5" : "#ffffff", "left", 1);
    
    if (cur) { 
      text("EQUIPPED", b.x + 84, b.y + 55, 10, T.col, "left", 1);
      text("PLAYING NOW", b.x + 84, b.y + 74, 9, T.col, "left", 2);
    }
    else if (unlocked) { 
      text("TAP TO USE", b.x + 84, b.y + 55, 10, "#ffffff", "left", 1);
      text("OWNED", b.x + 84, b.y + 74, 9, "#22d3a6", "left", 2);
    }
    else { 
      drawCoin(b.x + 84, b.y + 51, 5);
      text(String(sh.price), b.x + 93, b.y + 55, 11, wallet >= sh.price ? "#ffd166" : "#ffffff", "left", 0);
      text("LOCKED", b.x + 84, b.y + 74, 9, "#9ca3af", "left", 2);
    }
  }

  text("TAP ANY SHAPE TO BUY OR EQUIP", 225, 660, 9, "#9ca3af", "center", 1);

  rr(LBACK.x, LBACK.y, LBACK.w, LBACK.h, 16);
  ctx.fillStyle = "#062018"; ctx.fill();
  ctx.strokeStyle = "#22d3a6"; ctx.lineWidth = 2; ctx.stroke();
  text("BACK TO GAME", LBACK.x + LBACK.w/2, LBACK.y + LBACK.h/2, 15, "#22d3a6", "center", 2);

  drawFx();

  if (!gameReadySent) {
    ctx.fillStyle = "rgba(5,6,10,0.88)"; ctx.fillRect(0, 0, W, H);
    text("NERVE",   225, H/2 - 26, 34, "#e9edf5", "center", 8);
    text("LOADING", 225, H/2 + 16, 12, "#ffffff", "center", 4);
  }
}


/* ----------------------------------------------------------
   14. SHOP SCREEN
   ---------------------------------------------------------- */
function drawTile(b, it, owned, eq, kind){
  rr(b.x, b.y, b.w, b.h, 14);
  ctx.fillStyle = eq ? "#101a24" : "#0d1018"; ctx.fill();
  ctx.strokeStyle = eq ? (it.col || "#22d3a6") : (owned ? "#2a3348" : "#1a1f2e");
  ctx.lineWidth = eq ? 2 : 1;
  ctx.stroke();

  var cx = b.x + b.w / 2, cy = b.y + (kind === "power" ? 34 : 40);
  ctx.save();
  if (!owned) ctx.globalAlpha = 0.40;
  if (kind === "char") drawChar(it.id, cx, cy, 44, it.col || "#22d3a6", 1);
  else if (kind === "obj") drawObj(it.id, cx, cy, 0, it.col, 1);
  else if (kind === "power") {
    ctx.fillStyle = "#101827";
    ctx.strokeStyle = it.col;
    ctx.lineWidth = 3;
    ctx.shadowColor = it.col; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    drawPowerIcon(it.id, cx, cy, 35, it.col);
    text("x" + POWER_STOCK[it.id], b.x + b.w - 9, b.y + 13, 10, "#ffffff", "right", 1);
  }
  else if (kind === "shape") {
    var oldShape = S.shape;
    var sidx = SHAPES.indexOf(it);
    S.shape = sidx >= 0 ? sidx : 0;
    
    ctx.save();
    ctx.translate(cx, cy);
    var scale = 0.25;
    ctx.beginPath();
    var pts = 32;
    for (var k=0; k<=pts; k++) {
      var pt = pathAt(k / pts);
      var px = (pt.x - A.cx) * scale;
      var py = (pt.y - A.cy) * scale;
      if (k===0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    if (it.wrap) ctx.closePath();
    ctx.strokeStyle = it.col || "#38bdf8";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
    
    S.shape = oldShape;
  }
  else if (kind === "bg") {
    var img = getImg(it.src);
    if (img && img.complete) {
      ctx.save();
      ctx.beginPath();
      rr(cx - 24, cy - 24, 48, 48, 8);
      ctx.clip();
      ctx.drawImage(img, 0, 0, img.width, img.height, cx - 24, cy - 24, 48, 48);
      ctx.restore();
    } else {
      ctx.fillStyle = "#1a1f2e";
      rr(cx - 24, cy - 24, 48, 48, 8);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    rr(cx - 24, cy - 24, 48, 48, 8);
    ctx.stroke();
  }
  ctx.restore();

  text(it.name, cx, b.y + (kind === "power" ? 78 : 76), 11,
       owned ? "#e9edf5" : "#ffffff", "center", 1);

  if (kind === "power") {
    drawCoin(cx - 21, b.y + 98, 6);
    text(String(it.price), cx - 10, b.y + 98, 12, "#ffd166", "left", 0);
  } else if (eq) {
    text("EQUIPPED", cx, b.y + 94, 10, it.col || "#22d3a6", "center", 1);
  } else if (owned) {
    text("TAP TO USE", cx, b.y + 94, 10, "#ffffff", "center", 1);
  } else {
    drawCoin(cx - 21, b.y + 94, 6);
    text(String(it.price), cx - 10, b.y + 94, 12, wallet >= it.price ? "#ffd166" : "#ffffff", "left", 0);
  }
}

function drawShop(){
  var i, b, it, owned, eq;
  drawBg();

  text("SHOP", 225, 48, 30, "#e9edf5", "center", 8);
  drawCoin(190, 82, 9);
  text(wallet + " COINS", 205, 82, 15, "#ffd166", "left", 1);

  var tabs = [
    { id:"char",  name:"CHARACTERS", col:"#38bdf8" },
    { id:"obj",   name:"OBJECTS",    col:"#a855f7" },
    { id:"bg",    name:"BACKGROUNDS",col:"#22d3a6" },
    { id:"power", name:"POWERS",     col:"#ffd166" }
  ];
  var ti, tb, rail, activeTab, tabGrad;

  /* Modern segmented category rail. */
  rail = shopTabRailBox();
  rr(rail.x, rail.y, rail.w, rail.h, 16);
  ctx.fillStyle = "rgba(5,8,16,0.88)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,145,185,0.18)"; ctx.lineWidth = 1; ctx.stroke();

  for (ti = 0; ti < tabs.length; ti++) {
    tb = shopTabBox(ti);
    activeTab = S.shopTab === tabs[ti].id;
    rr(tb.x, tb.y, tb.w, tb.h, 13);
    if (activeTab) {
      tabGrad = ctx.createLinearGradient(tb.x, tb.y, tb.x, tb.y + tb.h);
      tabGrad.addColorStop(0, "#1b2942");
      tabGrad.addColorStop(1, "#0b1220");
      ctx.fillStyle = tabGrad;
      ctx.shadowColor = tabs[ti].col; ctx.shadowBlur = 12;
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = tabs[ti].col; ctx.lineWidth = 1.8; ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(15,21,34,0.48)"; ctx.fill();
    }

    if (!IS_MOBILE) {
      ctx.beginPath(); ctx.arc(tb.x + 12, tb.y + 20, activeTab ? 4 : 3, 0, Math.PI * 2);
      ctx.fillStyle = activeTab ? tabs[ti].col : "#465268"; ctx.fill();
    }
    text(tabs[ti].name, tb.x + tb.w / 2, tb.y + 19, IS_MOBILE ? (ti === 2 ? 6.5 : 7.5) : (ti === 2 ? 8 : 9),
         activeTab ? "#ffffff" : "#7f8ba0", "center", activeTab && !IS_MOBILE ? 1 : 0);
    if (IS_MOBILE && activeTab) {
      rr(tb.x + tb.w * 0.24, tb.y + 34, tb.w * 0.52, 2, 1);
      ctx.fillStyle = tabs[ti].col; ctx.fill();
    }
  }

  var list = (S.shopTab === "char") ? CHARS : (S.shopTab === "obj" ? OBJS : (S.shopTab === "bg" ? BGS : POWERS));
  var curId = (S.shopTab === "char") ? charId : (S.shopTab === "obj" ? objId : (S.shopTab === "bg" ? bgId : ""));

  for (i = 0; i < list.length; i++) {
    it = list[i]; b = tileBox(S.shopTab, i);
    owned = S.shopTab === "power" || !!OWNED[S.shopTab + ":" + it.id] || it.price === 0;
    drawTile(b, it, owned, curId === it.id, S.shopTab);
  }

  rr(BACK.x, BACK.y, BACK.w, BACK.h, 16);
  ctx.fillStyle = "#062018"; ctx.fill();
  ctx.strokeStyle = "#22d3a6"; ctx.lineWidth = 2; ctx.stroke();
  text("BACK TO GAME", BACK.x + BACK.w/2, BACK.y + BACK.h/2, 15, "#22d3a6", "center", 2);

  if (S.shopMsgT > 0) {
    ctx.globalAlpha = Math.min(1, S.shopMsgT);
    text(S.shopMsg, 225, 744, 12, "#ffd166", "center", 1);
    ctx.globalAlpha = 1;
  } else {
    text("TAP AN ITEM TO BUY OR EQUIP", 225, 744, 11, "#9ca3af", "center", 2);
  }

  drawFx();

  if (!gameReadySent) {
    ctx.fillStyle = "rgba(5,6,10,0.88)"; ctx.fillRect(0, 0, W, H);
    text("NERVE",   225, H/2 - 26, 34, "#e9edf5", "center", 8);
    text("LOADING", 225, H/2 + 16, 12, "#ffffff", "center", 4);
  }
}


/* ----------------------------------------------------------
   15. MAIN LOOP
   ---------------------------------------------------------- */
function frame(now){
  requestAnimationFrame(frame);

  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  /* Keep real-time movement through dropped frames, while ignoring long pauses. */
  if (dt > 0.25) dt = 0.25;
  if (dt < 0)    dt = 0;
  if (paused)    dt = 0;

  TT    += dt;
  idleT += dt;
  S.blink -= dt;
  if (S.blink < -2.4) S.blink = 0.12 + Math.random() * 0.10;

  if (S.screen === "game") {
    if (S.phase === "idle" || S.phase === "run") {
      var sp = S.speed * (slowT > 0 ? CFG.slowMoRate : (S.slowHits > 0 ? 0.55 : 1));
      if (shp().wrap) {
        S.pos += sp * dt;
        while (S.pos > 1) S.pos -= 1;
      } else {
        S.pos += S.dir * sp * dt;
        /* Reflect the full overshoot so low-FPS frames never lose movement. */
        while (S.pos > 1 || S.pos < 0) {
          if (S.pos > 1) { S.pos = 2 - S.pos; S.dir = -1; }
          if (S.pos < 0) { S.pos = -S.pos;    S.dir =  1; }
        }
      }
      var tp = pathAt(S.pos);
      trail.push({ x: tp.x, y: tp.y, t: S.pos });
      if (trail.length > CFG.trailN) trail.shift();
      if (S.drift) {           /* sarakta hua zone (level 20+) */
        var dLo = shp().wrap ? 0.012 : 0.035, dHi = 1 - S.zoneW - dLo;
        S.zoneA += S.drift * dt;
        if (S.zoneA < dLo) { S.zoneA = dLo; S.drift = -S.drift; }
        if (S.zoneA > dHi) { S.zoneA = dHi; S.drift = -S.drift; }
      }
    } else if (S.phase === "miss") {
      S.missT -= dt;
      if (S.missT <= 0) {
        S.missT = 0;
        S.phase = "run";
        S.pos = 0; S.dir = 1;
        placeZone();
        say("GO AGAIN", S.lives + (S.lives === 1 ? " LIFE LEFT" : " LIVES LEFT"));
      }
    }
    musicTick(dt);
  }

  if (slowT      > 0) slowT      -= dt;
  if (S.flash    > 0) S.flash    -= dt * 2.4;
  if (S.shake    > 0) S.shake    -= dt * 3.2;
  if (S.happyT   > 0) S.happyT   -= dt;
  if (S.zoom     > 0) S.zoom     -= dt * 3;
  if (S.msgT     > 0) S.msgT     -= dt;
  if (S.mileT    > 0) S.mileT    -= dt;
  if (S.shopMsgT > 0) S.shopMsgT -= dt;
  if (S.buyFlash > 0) S.buyFlash -= dt * 2;

  stepFx(dt);

  if (S.screen === "shop")        drawShop();
  else if (S.screen === "levels") drawLevels();
  else                            drawGame();

  ytFirstFrame();
  tryGameReady();
}


/* ----------------------------------------------------------
   BOOT
   ---------------------------------------------------------- */
if (IN_YT && YT.system) {
  try {
    if (YT.system.isAudioEnabled) ytAudioOK = !!YT.system.isAudioEnabled();
    if (YT.system.onAudioEnabledChange) {
      YT.system.onAudioEnabledChange(function(on){ ytAudioOK = !!on; applyAudioGate(); });
    }
    if (YT.system.onPause)  YT.system.onPause(doPause);
    if (YT.system.onResume) YT.system.onResume(doResume);
  } catch(e){ logWarn(); }
}

resize();
newRun();
loadSave();
AdManager.init();
last = 0;
requestAnimationFrame(frame);

})();
